{% raw %}
<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceChat Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .header {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .avatar {
            width: 50px; height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold;
        }
        .coins {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #333;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .room-card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .room-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .seats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .seat {
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .seat:hover { background: rgba(255,255,255,0.25); }
        .seat.occupied { background: rgba(76, 175, 80, 0.3); }
        .seat.host { background: rgba(255, 215, 0, 0.3); }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .btn-danger { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .messages {
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 15px;
        }
        .message { margin-bottom: 10px; padding: 8px; background: rgba(255,255,255,0.1); border-radius: 8px; }
        input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: rgba(255,255,255,0.2);
            color: white;
            margin-top: 10px;
        }
        input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.6); }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading">⏳ እየተጫነ ነው...</div>
        
        <div id="main-app" class="hidden">
            <div class="header">
                <div class="user-info">
                    <div class="avatar" id="user-avatar">T</div>
                    <div>
                        <div id="user-name">User</div>
                        <div id="user-id" style="font-size: 12px; opacity: 0.7;"></div>
                    </div>
                </div>
                <div class="coins">
                    <span>🪙</span>
                    <span id="user-coins">0</span>
                </div>
            </div>

            <div id="rooms-list"></div>

            <div id="room-view" class="hidden">
                <div class="room-card">
                    <div class="room-header">
                        <h2 id="room-name">Room</h2>
                        <button class="btn btn-danger" onclick="exitRoom()">ውጣ</button>
                    </div>
                    <div class="seats-grid" id="seats-grid"></div>
                    <div class="messages" id="messages"></div>
                    <input type="text" id="chat-input" placeholder="መልዕክት ይጻፉ...">
                    <button class="btn" onclick="sendChat()">ላክ</button>
                </div>
            </div>

            <div id="create-room" class="hidden">
                <div class="room-card">
                    <h2>አዲስ ክፍል ይፍጠሩ</h2>
                    <input type="text" id="room-id" placeholder="Room ID (letters/numbers only)">
                    <input type="text" id="room-name-input" placeholder="የክፍሉ ስም">
                    <button class="btn" onclick="createRoom()">ፍጠር</button>
                </div>
            </div>

            <button class="btn" onclick="showCreateRoom()">+ አዲስ ክፍል</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.ready();

        let currentUser = null;
        let currentRoom = null;
        let initData = '';

        async function api(url, method = 'GET', body = null) {
            const headers = { 'Content-Type': 'application/json' };
            if (initData) headers['X-Telegram-Init-Data'] = initData;
            const opts = { method, headers };
            if (body) opts.body = JSON.stringify(body);
            const res = await fetch(url, opts);
            return await res.json();
        }

        async function init() {
            initData = tg?.initData || '';
            const data = await api('/api/register', 'POST');
            if (!data.success) {
                document.getElementById('loading').textContent = '❌ ስህተት: ' + (data.error || 'Unknown');
                return;
            }
            currentUser = data.user;
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('user-name').textContent = currentUser.username;
            document.getElementById('user-id').textContent = data.user_id;
            document.getElementById('user-coins').textContent = currentUser.coins;
            document.getElementById('user-avatar').textContent = currentUser.username[0]?.toUpperCase() || 'U';
            loadRooms();
        }

        async function loadRooms() {
            const rooms = await api('/api/rooms');
            const container = document.getElementById('rooms-list');
            container.innerHTML = '';
            if (Object.keys(rooms).length === 0) {
                container.innerHTML = '<div class="room-card">ምንም ክፍሎች የሉም</div>';
                return;
            }
            for (const [rid, room] of Object.entries(rooms)) {
                const div = document.createElement('div');
                div.className = 'room-card';
                div.innerHTML = `
                    <h3>${room.name}</h3>
                    <p>ባለቤት: ${room.creator_name} | ሰዎች: ${room.count}</p>
                    <button class="btn" onclick="joinRoom('${rid}')">ግባ</button>
                `;
                container.appendChild(div);
            }
        }

        async function joinRoom(rid) {
            const data = await api(`/api/rooms/${rid}/state`);
            if (!data.success) { alert(data.error); return; }
            currentRoom = rid;
            document.getElementById('rooms-list').classList.add('hidden');
            document.getElementById('room-view').classList.remove('hidden');
            document.getElementById('room-name').textContent = data.name;
            renderSeats(data.seats);
            renderMessages(data.messages);
        }

        function renderSeats(seats) {
            const grid = document.getElementById('seats-grid');
            grid.innerHTML = '';
            for (let i = 0; i < 21; i++) {
                const seat = document.createElement('div');
                seat.className = 'seat';
                const s = seats[i];
                if (i === 0) {
                    seat.classList.add('host');
                    seat.innerHTML = s ? `👑<br>${s.name}` : '👑<br>host';
                } else {
                    if (s) {
                        seat.classList.add('occupied');
                        seat.innerHTML = `🛋️<br>${s.name}`;
                    } else {
                        seat.innerHTML = `🛋️<br>${i}`;
                    }
                }
                seat.onclick = () => takeSeat(i);
                grid.appendChild(seat);
            }
        }

        async function takeSeat(idx) {
            const data = await api(`/api/rooms/${currentRoom}/seat`, 'POST', { seat: idx });
            if (data.success) {
                const state = await api(`/api/rooms/${currentRoom}/state`);
                renderSeats(state.seats);
            } else {
                alert(data.error);
            }
        }

        function renderMessages(msgs) {
            const container = document.getElementById('messages');
            container.innerHTML = '';
            msgs.forEach(m => {
                const div = document.createElement('div');
                div.className = 'message';
                div.textContent = m.sys ? m.text : `${m.name}: ${m.text}`;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        async function sendChat() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            await api(`/api/rooms/${currentRoom}/chat`, 'POST', { text });
            input.value = '';
            const state = await api(`/api/rooms/${currentRoom}/state`);
            renderMessages(state.messages);
        }

        async function exitRoom() {
            await api(`/api/rooms/${currentRoom}/exit`, 'POST');
            currentRoom = null;
            document.getElementById('room-view').classList.add('hidden');
            document.getElementById('rooms-list').classList.remove('hidden');
            loadRooms();
        }

        function showCreateRoom() {
            document.getElementById('create-room').classList.toggle('hidden');
        }

        async function createRoom() {
            const rid = document.getElementById('room-id').value.trim();
            const name = document.getElementById('room-name-input').value.trim();
            if (!rid || !name) { alert('ሁለቱንም ይሙሉ'); return; }
            const data = await api('/api/rooms/create', 'POST', { room_id: rid, room_name: name });
            if (data.success) {
                document.getElementById('create-room').classList.add('hidden');
                loadRooms();
            } else {
                alert(data.error);
            }
        }

        init();
    </script>
</body>
</html>
{% endraw %}
