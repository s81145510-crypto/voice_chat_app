<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0118">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="21Party">
<title>Twenty One Party</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>
<style>
:root{--bg:#0a0118;--bg2:#1a0a2e;--card:rgba(255,255,255,.065);--line:rgba(255,255,255,.1);--gold:#ffd700;--pri:#667eea;--pri2:#9b5cff;--ok:#2ee59d;--bad:#ff5c7a;--mut:#a99bc4;--usdt:#26a17b;--live:#ff2d55;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(160deg,var(--bg),var(--bg2)) fixed;color:#fff;font:15px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:0}
.page{position:fixed;inset:0;padding:calc(var(--st) + 12px) 14px calc(76px + var(--sb));overflow-y:auto;display:none}
.page.on{display:block;animation:fade .25s}
.page::-webkit-scrollbar,.sheet::-webkit-scrollbar,.chat::-webkit-scrollbar,#lv-chat::-webkit-scrollbar,.pk-chat::-webkit-scrollbar,.ilist::-webkit-scrollbar{width:6px}
.page::-webkit-scrollbar-track,.sheet::-webkit-scrollbar-track,.chat::-webkit-scrollbar-track,#lv-chat::-webkit-scrollbar-track,.pk-chat::-webkit-scrollbar-track,.ilist::-webkit-scrollbar-track{background:rgba(155,92,255,.08);border-radius:6px}
.page::-webkit-scrollbar-thumb,.sheet::-webkit-scrollbar-thumb,.chat::-webkit-scrollbar-thumb,#lv-chat::-webkit-scrollbar-thumb,.pk-chat::-webkit-scrollbar-thumb,.ilist::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--pri),var(--pri2));border-radius:6px}
.page::-webkit-scrollbar-thumb:hover,.sheet::-webkit-scrollbar-thumb:hover{background:var(--gold)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{margin:6px 0 12px;font-size:20px}h3{margin:14px 0 8px;font-size:15px;color:var(--mut);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;backdrop-filter:blur(8px)}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}.col{display:flex;flex-direction:column;gap:8px}
.mut{color:var(--mut);font-size:12px}.gold{color:var(--gold)}.usdt{color:var(--usdt)}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{padding:11px 16px;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri2));font-weight:600;transition:.15s}
.btn:active{transform:scale(.96)}.btn.gold{background:linear-gradient(135deg,#ffd700,#ff9f1c);color:#2a1a00}.btn.ghost{background:var(--card);border:1px solid var(--line)}
.btn.bad{background:linear-gradient(135deg,#ff5c7a,#d6336c)}.btn.live{background:linear-gradient(135deg,#ff2d55,#ff6b8a)}.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}.btn[disabled]{opacity:.5}
.chip{padding:7px 13px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip.on{background:linear-gradient(135deg,var(--pri),var(--pri2));border-color:transparent}
.chip.onu{background:linear-gradient(135deg,#26a17b,#3ddc97);border-color:transparent;color:#04231a;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.chips::-webkit-scrollbar{display:none}
input,textarea,select{width:100%;padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid var(--line);outline:0}
input:focus,textarea:focus{border-color:var(--pri2)}
.av{width:44px;height:44px;border-radius:50%;background:#444 center/cover;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;position:relative}
.av.s{width:34px;height:34px;font-size:13px}.av.l{width:72px;height:72px;font-size:28px}.av.xs{width:26px;height:26px;font-size:11px}
.pill{display:inline-flex;gap:5px;align-items:center;padding:5px 11px;border-radius:20px;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.35);color:var(--gold);font-weight:700;font-size:13px}
.badge{font-size:11px;padding:2px 7px;border-radius:8px;background:rgba(155,92,255,.25)}
.hbadge{font-size:10px;padding:2px 6px;border-radius:7px;background:rgba(46,229,157,.18);color:var(--ok);font-weight:700}
.abadge{font-size:10px;padding:2px 6px;border-radius:7px;background:rgba(102,126,234,.2);color:#9db4ff;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 8px var(--ok)}
.dot.off{background:#5a5470;box-shadow:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.logo{font-weight:800;font-size:18px;background:linear-gradient(90deg,#ffd700,#ff9f1c,#9b5cff);-webkit-background-clip:text;color:transparent}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;padding:6px 6px calc(6px + var(--sb));background:rgba(10,1,24,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:20}
nav button{flex:1;background:none;color:var(--mut);font-size:10px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:21px;filter:grayscale(.7)}nav button.on{color:#fff}nav button.on i{filter:none;transform:translateY(-2px)}
.mini{position:fixed;left:10px;right:10px;bottom:calc(66px + var(--sb));z-index:19;display:none;align-items:center;gap:10px;padding:9px 12px;border-radius:16px;background:linear-gradient(135deg,#3b2a8f,#7a3fd1);box-shadow:0 6px 24px #0008}
.mini.on{display:flex}
.hero{background:linear-gradient(135deg,rgba(102,126,234,.35),rgba(155,92,255,.25));border-radius:18px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.room-card{display:flex;gap:12px;align-items:center}.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:5px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.game{text-align:center;padding:18px 8px;border-radius:16px;background:var(--card);border:1px solid var(--line)}.game b{display:block;font-size:34px}.game span{font-size:12px;color:var(--gold)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:480px;max-height:88vh;overflow-y:auto;background:linear-gradient(180deg,#1d0f38,#12072a);border-radius:22px 22px 0 0;padding:16px 16px calc(16px + var(--sb));border:1px solid var(--line)}
.sheet h3{color:#fff;font-size:17px;margin:0 0 12px}
.toast{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translateX(-50%);background:#000d;padding:10px 16px;border-radius:14px;z-index:99;max-width:90%;text-align:center;animation:fade .2s;border:1px solid var(--line)}
.vip{display:inline-block;font-size:9px;font-weight:800;padding:1px 5px;border-radius:6px;background:linear-gradient(135deg,#ffd700,#ff9f1c);color:#2a1a00;vertical-align:1px}
.vipn{color:var(--gold)}
.vipc{border-color:rgba(255,215,0,.45);background:linear-gradient(135deg,rgba(255,215,0,.13),rgba(255,159,28,.06))}
.fr{--rw:3px}.av.l.fr{--rw:4px}.av.s.fr{--rw:2.5px}.av.xs.fr{--rw:2px}
.fr::before{content:'';position:absolute;inset:-4px;border-radius:50%;pointer-events:none;box-shadow:0 0 10px var(--gl,transparent)}
.fr::after{content:'';position:absolute;inset:-4px;border-radius:50%;pointer-events:none;background:var(--fr);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - var(--rw)),#000 calc(100% - var(--rw) + .6px));mask:radial-gradient(farthest-side,transparent calc(100% - var(--rw)),#000 calc(100% - var(--rw) + .6px))}
.fr-neon{--fr:linear-gradient(135deg,#c4a1ff,#667eea);--gl:#9b5cff99}
.fr-ice{--fr:conic-gradient(#e6fbff,#4cc9f0,#e6fbff,#4cc9f0,#e6fbff);--gl:#4cc9f066}
.fr-fire{--fr:conic-gradient(#ff3d00,#ffb300,#ff3d00,#ffb300,#ff3d00);--gl:#ff6a0088}
.fr-rose{--fr:conic-gradient(#ff5c7a,#ffd1dc,#ff5c7a,#d6336c,#ff5c7a);--gl:#ff5c7a66}
.fr-rainbow{--fr:conic-gradient(#ff3b3b,#ffb300,#f5ff3b,#2ee59d,#4cc9f0,#667eea,#c77dff,#ff3b3b);--gl:#c77dff66}
.fr-vgold{--fr:conic-gradient(#fff3b0,#ffd700,#b8860b,#ffd700,#fff3b0);--gl:#ffd70099}
.fr-vaurora{--fr:conic-gradient(#2ee59d,#667eea,#c77dff,#4cc9f0,#2ee59d);--gl:#2ee59d66}
.fr-fire::after,.fr-rainbow::after,.fr-vgold::after,.fr-vaurora::after{animation:frspin 3.2s linear infinite}
@keyframes frspin{to{transform:rotate(360deg)}}
.fg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fi{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px 9px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:12px;text-align:center}
.fi.on{border-color:var(--gold);background:rgba(255,215,0,.12)}.fi .fp{color:var(--gold);font-size:11px}
.ms{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.ms:last-of-type{border-bottom:0}
#room{position:fixed;inset:0;z-index:30;background:linear-gradient(160deg,#0a0118,#1b0b33 60%,#2a0f4a);display:none;flex-direction:column;padding-top:var(--st)}
#room.on{display:flex}
.rh{display:flex;align-items:center;gap:10px;padding:10px 12px}.rh .t{flex:1;min-width:0}.rh button{background:var(--card);border-radius:12px;width:38px;height:38px;font-size:17px;color:#fff}
.seats{padding:4px 10px 6px}.hostrow{display:flex;justify-content:center;margin-bottom:8px}
.sg{display:grid;grid-template-columns:repeat(5,1fr);gap:7px 4px}
.seat{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;position:relative}
.seat .av{width:50px;height:50px;border:2px solid transparent}.seat.host .av{width:66px;height:66px;border-color:var(--gold);box-shadow:0 0 18px #ffd70066}
.seat.empty .av{background:rgba(255,255,255,.06);border:1.5px dashed rgba(255,255,255,.25);color:var(--mut);font-size:12px}
.seat.speak .av{border-color:var(--ok);box-shadow:0 0 0 4px #2ee59d44;animation:sp .7s infinite alternate}
@keyframes sp{to{box-shadow:0 0 0 7px #2ee59d22}}
.seat .nm{font-size:10.5px;max-width:100%;color:#ddd}.seat .mt{position:absolute;top:34px;right:calc(50% - 31px);font-size:12px;background:#000a;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center}
.chat{flex:1;overflow-y:auto;padding:6px 12px;display:flex;flex-direction:column;gap:5px}
.msg{background:rgba(255,255,255,.07);padding:6px 10px;border-radius:12px;align-self:flex-start;max-width:88%;word-break:break-word;font-size:13.5px}
.msg b{color:#c9b6ff}.msg.gift{background:linear-gradient(135deg,rgba(255,215,0,.2),rgba(255,92,122,.2));border:1px solid rgba(255,215,0,.3)}
.msg.lucky{background:linear-gradient(135deg,rgba(46,229,157,.25),rgba(255,215,0,.2));border:1px solid rgba(46,229,157,.4)}
.msg.sys{background:rgba(102,126,234,.18);border:1px solid rgba(102,126,234,.35);color:#cdd8ff}
.bar{display:flex;gap:8px;align-items:center;padding:8px 10px calc(8px + var(--sb));border-top:1px solid var(--line);background:rgba(0,0,0,.25)}
.bar input{border-radius:22px}.rb{width:44px;height:44px;border-radius:50%;background:var(--card);font-size:20px;flex:none;border:1px solid var(--line)}
.rb.mic{background:linear-gradient(135deg,var(--ok),#10b981);display:none}.rb.mic.on{display:block}.rb.mic.off{background:linear-gradient(135deg,#ff5c7a,#d6336c)}
.vs{font-size:11px;padding:3px 9px;border-radius:10px;background:#0006}
.fly{position:fixed;left:50%;top:42%;z-index:90;font-size:90px;pointer-events:none;animation:fly 2.6s ease-out forwards;text-align:center;filter:drop-shadow(0 0 24px gold)}
.fly small{display:block;font-size:14px;color:#fff;background:#000a;border-radius:12px;padding:3px 10px;margin-top:4px}
@keyframes fly{0%{transform:translate(-50%,60px) scale(.3);opacity:0}20%{transform:translate(-50%,0) scale(1.15);opacity:1}75%{transform:translate(-50%,-20px) scale(1);opacity:1}100%{transform:translate(-50%,-120px) scale(.9);opacity:0}}
.fly.big{font-size:150px;animation-duration:3.8s}
.fly.luckyfly{filter:drop-shadow(0 0 30px #2ee59d)}
.gg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.gi{text-align:center;padding:9px 2px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:11px}.gi b{display:block;font-size:28px}.gi.on{border-color:var(--gold);background:rgba(255,215,0,.12)}
.tier-rare{box-shadow:inset 0 0 0 1px #4cc9f0}.tier-epic{box-shadow:inset 0 0 0 1px #c77dff}.tier-luxury{box-shadow:inset 0 0 0 1px #ffd700}.tier-legendary{box-shadow:inset 0 0 0 1px #ff5c7a}.tier-mythic{box-shadow:inset 0 0 0 1px #2ee59d,0 0 10px #2ee59d55}
.tier-lucky{box-shadow:inset 0 0 0 1px #2ee59d,0 0 12px #2ee59d66;background:linear-gradient(135deg,rgba(46,229,157,.12),rgba(255,215,0,.08))}
.bar2{height:8px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--gold))}
.res{text-align:center;font-size:44px;min-height:64px;margin:8px 0}.win{color:var(--ok)}.lose{color:var(--bad)}
.splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:100;background:linear-gradient(160deg,var(--bg),var(--bg2))}
.spin{width:36px;height:36px;border:4px solid #fff3;border-top-color:var(--gold);border-radius:50%;animation:rot 1s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--mut);padding:26px 0}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.foot a{color:var(--mut);text-decoration:none;font-size:12px;padding:6px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.ratebar{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut);background:rgba(38,161,123,.1);border:1px solid rgba(38,161,123,.3);border-radius:12px;padding:7px 10px;margin-bottom:10px}
.addr{display:flex;gap:8px;align-items:center;background:rgba(38,161,123,.12);border:1px solid rgba(38,161,123,.35);border-radius:12px;padding:8px 10px;margin-top:6px}
.addr b{flex:1;min-width:0;word-break:break-all;font-size:12px;color:#3ddc97}
#live{position:fixed;inset:0;z-index:30;background:#000;display:none}#live.on{display:block}
.lv-grid{position:absolute;inset:0;display:grid;gap:2px;background:#050208}
.lv-pane{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 35%,#2a1150,#0a0413 70%)}
.lv-pane video{width:100%!important;height:100%!important;object-fit:cover!important}
.lv-pane > div:not(.lv-ph):not(.lv-name):not(.lv-kind):not(.lv-ctrl){position:absolute;inset:0;z-index:1}
.lv-pane.act{box-shadow:inset 0 0 0 2px var(--ok)}
.lv-pane.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--mut);background:linear-gradient(160deg,#170a2c,#0c0518);border:1px dashed rgba(155,92,255,.35)}
.lv-pane.empty .plus{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:0 0 24px #9b5cff66}
.lv-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:0}
.lv-name{position:absolute;left:6px;bottom:6px;right:6px;display:flex;align-items:center;gap:6px;background:#000a;border-radius:20px;padding:3px 9px 3px 3px;z-index:2;font-size:12px;backdrop-filter:blur(6px)}
.lv-kind{position:absolute;left:6px;top:6px;background:#000a;border-radius:8px;padding:2px 8px;font-size:10px;font-weight:800;z-index:2;color:var(--gold);letter-spacing:.4px}
.lv-ctrl{position:absolute;right:6px;top:6px;display:flex;gap:5px;z-index:3}
.lv-ctrl button{width:29px;height:29px;border-radius:50%;background:#000b;color:#fff;font-size:13px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.lv-top{position:absolute;top:calc(var(--st) + 8px);left:8px;right:8px;display:flex;align-items:center;gap:7px;z-index:4}
.lv-bot{position:absolute;left:0;right:0;bottom:0;padding:26px 10px calc(10px + var(--sb));background:linear-gradient(transparent,#000d 55%);z-index:4}
#lv-chat{max-height:26vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px;margin-bottom:8px;width:84%}#lv-chat .msg{background:#0008;backdrop-filter:blur(4px)}
.lv-tag{background:var(--live);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:800;letter-spacing:.5px;box-shadow:0 0 16px #ff2d5588}
.lv-hostchip{display:flex;align-items:center;gap:6px;background:#000a;border-radius:22px;padding:3px 12px 3px 3px;backdrop-filter:blur(6px);max-width:52%}
.ilist{max-height:52vh;overflow-y:auto;margin-top:8px}
.irow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.irow:last-child{border-bottom:0}
.invbar{position:fixed;left:10px;right:10px;top:calc(var(--st) + 8px);z-index:70;display:none}
.invbar.on{display:block;animation:fade .25s}
.invcard{background:linear-gradient(135deg,#ff2d55,#9b5cff);border-radius:16px;padding:10px 12px;box-shadow:0 10px 30px #000b;display:flex;align-items:center;gap:10px}
#pk{position:fixed;inset:0;z-index:40;background:#000;display:none;flex-direction:column}
#pk.on{display:flex}
.pk-top{position:absolute;top:calc(var(--st) + 8px);left:8px;right:8px;z-index:3;display:flex;align-items:center;gap:6px}
.pk-vids{position:absolute;inset:0;display:flex}
.pk-pane{flex:1;position:relative;overflow:hidden;background:radial-gradient(#1b0b33,#000)}
.pk-pane video{width:100%;height:100%;object-fit:cover!important}
.pk-pane .tag{position:absolute;top:calc(var(--st) + 44px);left:8px;display:flex;align-items:center;gap:6px;background:#0008;border-radius:20px;padding:3px 10px 3px 3px;z-index:2}
.pk-pane.right .tag{left:auto;right:8px}
.pk-pane .score{position:absolute;bottom:120px;left:0;right:0;text-align:center;font-size:26px;font-weight:800;z-index:2;text-shadow:0 2px 8px #000}
.pk-pane.left .score{color:#7db4ff}.pk-pane.right .score{color:#ff8a8a}
.pk-mid{position:absolute;left:50%;top:calc(var(--st) + 44px);transform:translateX(-50%);z-index:3;background:linear-gradient(135deg,#ffd700,#ff9f1c);color:#2a1a00;font-weight:900;border-radius:12px;padding:4px 12px;font-size:14px;box-shadow:0 0 20px #ffd70088}
.pk-bar{position:absolute;top:calc(var(--st) + 76px);left:10px;right:10px;height:10px;border-radius:6px;overflow:hidden;display:flex;z-index:3;background:#222}
.pk-bar .l{background:linear-gradient(90deg,#2563eb,#60a5fa);height:100%;transition:width .4s}
.pk-bar .r{background:linear-gradient(90deg,#f87171,#dc2626);height:100%;flex:1}
.pk-timer{position:absolute;top:calc(var(--st) + 92px);left:50%;transform:translateX(-50%);z-index:3;background:#000a;border-radius:12px;padding:2px 12px;font-weight:800;font-size:15px;color:var(--gold)}
.pk-bot{position:absolute;left:0;right:0;bottom:0;padding:20px 10px calc(10px + var(--sb));background:linear-gradient(transparent,#000d);z-index:3}
.pk-chat{max-height:22vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.pk-win{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#000c}
.pk-win.on{display:flex}
.pk-win b{font-size:30px;color:var(--gold)}
</style>
</head>
<body>

<script>
const tg=window.Telegram&&Telegram.WebApp;
try{tg&&(tg.ready(),tg.expand(),tg.setHeaderColor&&tg.setHeaderColor('#0a0118'),tg.setBackgroundColor&&tg.setBackgroundColor('#0a0118'),tg.disableVerticalSwipes&&tg.disableVerticalSwipes())}catch(e){}
let TOKEN=localStorage.getItem('tk')||'',S={me:null,cfg:null},R=null,PAGE='home',INVT=[];
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en-US');
const u2=n=>Number(n||0).toFixed(2);
const ago=t=>{const d=Math.floor(Date.now()/1000-t);return d<60?'now':d<3600?Math.floor(d/60)+'m':d<86400?Math.floor(d/3600)+'h':Math.floor(d/86400)+'d'};
function toast(m,t=2400){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),t)}
function hap(t='light'){try{tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred(t)}catch(e){}}
function copyTxt(s){try{navigator.clipboard.writeText(s);toast('📋 Copied')}catch(e){toast(s)}}
function av(u,cls=''){const n=(u&&u.name||'?')[0].toUpperCase();const h=((u&&u.id)||0)*47%360;const f=u&&u.fr?` fr fr-${esc(u.fr)}`:'';
 return u&&u.photo?`<div class="av ${cls}${f}" style="background-image:url('${esc(u.photo)}')"></div>`:`<div class="av ${cls}${f}" style="background:hsl(${h},55%,42%)">${esc(n)}</div>`}
const vipTag=u=>u&&u.vip?'<span class="vip">VIP</span>':'';
const hostTag=u=>u&&u.host==='host'?'<span class="hbadge">🎤 HOST</span>':'';
const agentTag=u=>u&&u.ag?'<span class="abadge">🤝 AGENT</span>':'';
const vipLeft=m=>Math.max(0,Math.ceil(((m.vip_until||0)-Date.now()/1000)/86400));
const U=()=>(S.cfg&&S.cfg.usdt)||{address:'',birr_per_usdt:161,coin_usdt:0.002484};
async function api(path,body,retry=true){
  const o={headers:{}};if(TOKEN)o.headers.Authorization='Bearer '+TOKEN;
  if(body!==undefined){o.method='POST';if(body instanceof FormData)o.body=body;else{o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}}
  let r;try{r=await fetch(path,o)}catch(e){throw new Error('No internet')}
  if(r.status===401&&retry){await login();return api(path,body,false)}
  const d=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(d.error||'Error');e.code=r.status;throw e}
  return d}
async function login(){
  const q=new URLSearchParams(location.search);
  const init=(tg&&tg.initData)||'';
  const payload={init,dev_id:q.get('dev')};
  if(!init&&!q.get('dev')){
    let gid=localStorage.getItem('guest_id');
    if(!gid){gid='g'+Math.random().toString(36).slice(2);localStorage.setItem('guest_id',gid)}
    payload.guest=gid;
  }
  const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const d=await r.json();if(!r.ok)throw new Error(d.error||'login failed');
  TOKEN=d.token;localStorage.setItem('tk',TOKEN);S.me=d.me;S.cfg=d.cfg}
function setMe(m){S.me=m;$$('.coins-n').forEach(e=>e.textContent=fmt(m.coins))}
function modal(html,onclose){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="sheet">${html}</div>`;
  o.onclick=e=>{if(e.target===o)close()};const close=()=>{o.remove();onclose&&onclose()};o.close=close;document.body.appendChild(o);return o}
const closeModal=()=>{const m=$$('.ov').pop();m&&m.close()};
async function run(btn,fn){if(btn)btn.disabled=true;try{return await fn()}catch(e){toast(e.message)}finally{if(btn)btn.disabled=false}}
function shrink(file,max=1100,q=.8){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error('image')),'image/jpeg',q)};i.onerror=()=>rej(new Error('Not an image'));i.src=URL.createObjectURL(file)})}
const topbar=()=>`<div class="top"><div class="logo">🎙 Twenty One</div><span class="pill" onclick="go('wallet')">🪙 <span class="coins-n">${fmt(S.me.coins)}</span></span></div>`;
const footbar=()=>`<div class="foot"><a href="${esc(S.cfg.channel)}" target="_blank">📢 Join Channel</a><a href="https://t.me/${esc((S.cfg.support||'').replace('@',''))}" target="_blank">🎧 Support</a></div>`;
const LOAD={home:renderHome,rooms:renderRooms,games:renderGames,wallet:renderWallet,community:renderCommunity,me:renderMe};
function go(p){PAGE=p;$$('.page').forEach(e=>e.classList.toggle('on',e.id==='p-'+p));$$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));hideRoom();LOAD[p]();hap()}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.p)};
setInterval(()=>{if(!document.hidden&&!R?.visible&&PAGE==='rooms')loadRoomList()},8000);
async function renderHome(){
  const m=S.me,el=$('#p-home');
  el.innerHTML=topbar()+`<div class="hero"><div class="row">${av(m,'l')}<div class="sp"><div style="font-size:18px;font-weight:700" class="ell">Hello ${esc(m.name)} 👋</div><div class="mut">${m.lvi} ${m.lvn} ${vipTag(m)} ${hostTag(m)} ${agentTag(m)} · 🪙 <span class="coins-n">${fmt(m.coins)}</span></div></div></div>
  <div class="row" style="margin-top:12px"><button class="btn gold sp" id="daily" ${m.daily_ready?'':'disabled'}>${m.daily_ready?'🎁 Claim daily reward'+(m.vip?' (VIP +50%)':''):'Claimed today ✓'}</button><button class="btn sp" onclick="go('rooms')">🎧 Enter room</button></div></div>
  <div id="h-ms"></div><h3>🔥 Trending rooms</h3><div id="h-rooms" class="empty">…</div><h3>🏆 Top gifters</h3><div id="h-lb" class="empty">…</div>${footbar()}`;
  $('#daily').onclick=e=>run(e.target,async()=>{const d=await api('/api/daily',{});setMe(d.me);toast(`🎉 +${d.reward} coins (Day ${d.streak})`);hap('medium');renderHome()});
  loadMsCard();
  api('/api/rooms').then(d=>{const r=d.rooms.slice(0,3);$('#h-rooms').className='';$('#h-rooms').innerHTML=r.length?r.map(roomCard).join(''):'<div class="empty">No rooms — open the first one!</div>'}).catch(()=>{});
  api('/api/leaderboard').then(d=>{const l=d.senders.slice(0,5);$('#h-lb').className='';$('#h-lb').innerHTML=l.length?`<div class="card">${l.map((u,i)=>`<div class="row" style="padding:5px 0">${['🥇','🥈','🥉','4','5'][i]}${av(u,'s')}<div class="sp ell">${esc(u.name)} ${vipTag(u)} <span class="badge">${u.lvi}${u.lvn}</span></div><b class="gold">${fmt(u.v)}</b></div>`).join('')}</div>`:'<div class="empty">No gifts yet</div>'}).catch(()=>{})}
let RT='voice';
function roomCard(r){const lv=r.kind==='live';return `<div class="card room-card" onclick="enterRoom('${r.id}')">${av(r.host,'')}<div class="sp"><div class="ell" style="font-weight:600">${lv?'<span class="lv-tag">LIVE</span> ':''}${esc(r.name)}</div><div class="mut ell">${esc(r.topic||('Host: '+(r.host?r.host.name:'-')))}</div></div><div style="text-align:right"><div><span class="live"></span><b>${r.online}</b></div><div class="mut">${lv?'🎥 '+(1+(r.guests||0))+' on stage':'🎤 '+r.seated+'/21'}</div></div></div>`}
function renderRooms(){$('#p-rooms').innerHTML=topbar()+`<div class="chips" style="margin-bottom:10px"><div class="chip ${RT==='voice'?'on':''}" onclick="RT='voice';renderRooms()">🎧 Voice</div><div class="chip ${RT==='live'?'on':''}" onclick="RT='live';renderRooms()">📹 Live</div></div><div class="row" style="margin-bottom:10px"><h2 class="sp" style="margin:0">${RT==='live'?'📹 Live streams':'🎧 Voice rooms'}</h2><button class="btn sm ${RT==='live'?'live':''}" onclick="newRoom(RT)">${RT==='live'?'📹 Go Live':'＋ Open room'}</button></div><div id="rl"><div class="empty">…</div></div>${footbar()}`;loadRoomList()}
async function loadRoomList(){try{const d=await api('/api/rooms');const l=d.rooms.filter(r=>(r.kind||'voice')===RT);const el=$('#rl');if(el)el.innerHTML=l.length?l.map(roomCard).join(''):`<div class="empty">${RT==='live'?'No live streams. Be the first!':'No rooms — open the first one!'}</div>`}catch(e){}}
function newRoom(kind){const lv=kind==='live';const m=modal(`<h3>${lv?'📹 Go Live':'🎙 New room'}</h3><div class="col"><input id="nr-n" placeholder="${lv?'Live title':'Room name'}" maxlength="40">${lv?'':'<input id="nr-t" placeholder="Topic (optional)" maxlength="100">'}<button class="btn ${lv?'live':''}" id="nr-b">${lv?'📹 Start':'Open'}</button></div>`);
  $('#nr-b').onclick=e=>run(e.target,async()=>{const d=await api('/api/rooms/create',{name:$('#nr-n').value,topic:lv?'':$('#nr-t').value,kind:lv?'live':'voice'});m.close();enterRoom(d.id)})}
const V={client:null,track:null,vtrack:null,rid:null,pub:false,busy:false,remotes:{},camOff:false,
 set(t,c){const e=$(R&&R.kind==='live'?'#lv-vs':'#r-vs');if(e){e.textContent=t;e.style.color=c||''}},
 async join(rid,kind){
  await this.leave();this.rid=rid;this.set('⏳');
  const d=await api('/api/agora-token',{room_id:rid});
  AgoraRTC.setLogLevel&&AgoraRTC.setLogLevel(3);
  AgoraRTC.onAutoplayFailed=()=>toast('🔊 Tap to enable sound');
  const c=AgoraRTC.createClient({mode:'live',codec:'vp8'});this.client=c;
  await c.setClientRole(d.publisher?'host':'audience');
  c.on('user-published',async(u,m)=>{try{await c.subscribe(u,m);
    this.remotes[u.uid]=this.remotes[u.uid]||{};this.remotes[u.uid][m]=m==='video'?u.videoTrack:u.audioTrack;
    if(m==='audio')u.audioTrack.play();else{try{c.setStreamFallbackOption&&c.setStreamFallbackOption(u,1)}catch(e){}attachTracks()}}catch(e){}});
  c.on('user-unpublished',(u,m)=>{if(this.remotes[u.uid])delete this.remotes[u.uid][m]});
  c.on('user-left',u=>{delete this.remotes[u.uid]});
  c.on('volume-indicator',vs=>{const on=new Set(vs.filter(v=>v.level>6).map(v=>v.uid));
    $$('.seat[data-uid]').forEach(s=>s.classList.toggle('speak',on.has(+s.dataset.uid)));
    $$('.lv-pane[data-uid]').forEach(s=>s.classList.toggle('act',on.has(+s.dataset.uid)))});
  c.on('token-privilege-will-expire',()=>this.renew());c.on('token-privilege-did-expire',()=>this.renew());
  c.on('connection-state-change',s=>{if(this.client!==c)return;this.set(s==='CONNECTED'?'🔊':s==='RECONNECTING'?'⏳':s==='DISCONNECTED'?'🔇':'',s==='CONNECTED'?'#2ee59d':'')});
  c.enableAudioVolumeIndicator();
  await c.join(d.app_id,d.channel,d.token,d.uid);
  if(this.client!==c){try{await c.leave()}catch(e){}return}
  if(d.publisher&&kind==='live')await this.startPublish();
  return d},
 async startPublish(){
  try{const[a,v]=await AgoraRTC.createMicrophoneAndCameraTracks({AEC:true,ANS:true,AGC:true},{encoderConfig:'480p_2',facingMode:'user'});
   this.track=a;this.vtrack=v;this.camOff=false;
   try{await this.client.enableDualStream()}catch(e){}
   await this.client.publish([a,v]);this.pub=true;
   $('#lv-flip').style.display='';$('#lv-mic').style.display='';attachTracks()}
  catch(e){toast('📷 Camera/mic not allowed — enable in phone settings')}},
 async renew(){try{const d=await api('/api/agora-token',{room_id:this.rid});await this.client.renewToken(d.token)}catch(e){}},
 async prepMic(){if(this.track)return true;
  try{this.track=await AgoraRTC.createMicrophoneAudioTrack({AEC:true,ANS:true,AGC:true});return true}
  catch(e){toast('🎤 Mic not allowed');return false}},
 async sync(seated,muted){
  const c=this.client;if(!c||this.busy||c.connectionState!=='CONNECTED')return;this.busy=true;
  try{
   if(seated&&!this.pub){
     if(!await this.prepMic()){await api('/api/rooms/'+this.rid+'/leave-seat',{});return}
     const d=await api('/api/agora-token',{room_id:this.rid});
     await c.setClientRole('host');if(d.token)await c.renewToken(d.token);
     await c.publish(this.track);this.pub=true}
   if(!seated&&this.pub){try{await c.unpublish(this.track)}catch(e){}this.track.close();this.track=null;await c.setClientRole('audience');this.pub=false}
   if(this.pub&&this.track)await this.track.setEnabled(!(muted||R?.selfMute));
   updateMicBtn(seated,muted)
  }catch(e){this.pub=false}finally{this.busy=false}},
 async stopPublish(){
  const c=this.client;if(!c)return;
  try{if(this.pub)await c.unpublish([this.track,this.vtrack].filter(Boolean))}catch(e){}
  if(this.track){try{this.track.close()}catch(e){}this.track=null}
  if(this.vtrack){try{this.vtrack.close()}catch(e){}this.vtrack=null}
  this.pub=false;try{await c.setClientRole('audience')}catch(e){}},
 async leave(){const c=this.client;this.client=null;this.pub=false;this.rid=null;this.remotes={};
  if(this.track){try{this.track.close()}catch(e){}this.track=null}
  if(this.vtrack){try{this.vtrack.close()}catch(e){}this.vtrack=null}
  if(c){try{await c.leave()}catch(e){}}}};
function attachTracks(){
  if(!R||R.kind!=='live')return;
  Object.keys(V.remotes).forEach(uid=>{const t=V.remotes[uid];const el=document.getElementById('lv-p'+uid);
    if(t&&t.video&&el){try{t.video.play('lv-p'+uid,{fit:'cover'})}catch(e){}}});
  if(V.vtrack){const el=document.getElementById('lv-p'+S.me.id);if(el){try{V.vtrack.play('lv-p'+S.me.id,{mirror:true,fit:'cover'})}catch(e){}}}
}
async function enterRoom(rid){
  if(R&&R.id===rid){showRoom();return}
  if(R)await exitRoom(true);
  try{const d=await api('/api/rooms/'+rid+'/join',{});
   R={kind:d.room.kind||'voice',id:rid,name:d.room.name,host:d.room.host_id,v:-1,mid:0,seats:{},guests:[],gkey:'',online:0,init:true,alive:true,selfMute:false,visible:true,t:null,n:0};
   $('#r-name').textContent=d.room.name;$('#r-chat').innerHTML='';$('#lv-chat').innerHTML='';$('#lv-host').innerHTML='';
   ['#lv-mic','#lv-flip','#lv-pk','#lv-invite','#lv-leave'].forEach(s=>$(s).style.display='none');
   $('#r-seats').innerHTML='';$('#r-host').innerHTML='';$('#lv-grid').innerHTML='';
   showRoom();V.join(rid,R.kind).catch(e=>{V.set('❌','#ff5c7a');toast('Media: '+e.message)});poll()
  }catch(e){toast(e.message==='ROOM_GONE'?'Room closed':e.message)}}
function showRoom(){if(!R)return;R.visible=true;$(R.kind==='live'?'#live':'#room').classList.add('on');$('#mini').classList.remove('on');$('#nav').style.display='none'}
function hideRoom(){if(R&&R.kind==='live')return;$('#room').classList.remove('on');$('#nav').style.display='';if(R){R.visible=false;$('#mini').classList.add('on');$('#mini-n').textContent=R.name;$('#mini-o').textContent=R.online}else $('#mini').classList.remove('on')}
function minimize(){go(PAGE==='home'?'rooms':PAGE)}
async function exitRoom(silent){const r=R;if(!r)return;if(!silent&&r.kind==='live'&&r.host===S.me.id&&!confirm('End the live?'))return;r.alive=false;clearTimeout(r.t);R=null;$('#live').classList.remove('on');
  $('#room').classList.remove('on');$('#mini').classList.remove('on');$('#nav').style.display='';
  await V.leave();api('/api/rooms/'+r.id+'/exit',{}).catch(()=>{});if(!silent&&PAGE==='rooms')loadRoomList()}
async function poll(){
  const r=R;if(!r||!r.alive)return;
  try{const d=await api('/api/rooms/'+r.id+'/state?v='+r.v+'&mid='+r.mid);if(R!==r)return;
   r.online=d.online;$('#r-on').textContent=d.online;$('#mini-o').textContent=d.online;$('#lv-on').textContent=d.online;
   if(d.seats){r.v=d.v;r.seats={};d.seats.forEach(s=>r.seats[s.i]=s);if(r.kind!=='live')renderSeats()}
   if(r.kind==='live'){r.guests=d.guests||[];const k=JSON.stringify(r.guests.map(x=>[x.u.id,x.muted]))+'|'+(r.seats[0]?r.seats[0].u.id:0);
     if(k!==r.gkey){r.gkey=k;renderLiveStage()}renderLiveHost();syncLiveBar()}
   (d.msgs||[]).forEach(m=>{r.mid=Math.max(r.mid,m.id);addMsg(m,!r.init)});r.init=false;

const P={client:null,track:null,vtrack:null,pid:null,pub:false,selfMute:false,t:null,alive:false,h1:0,h2:0};
async function enterPK(pid){
  if(P.alive)await exitPK();
  const st=await api('/api/pk/'+pid+'/state');
  P.pid=pid;P.alive=true;P.h1=st.host1?st.host1.id:0;P.h2=st.host2?st.host2.id:0;
  $('#pk').classList.add('on');$('#nav').style.display='none';$('#pk-win').classList.remove('on');$('#pk-chat').innerHTML='';
  $('#pk-tag1').innerHTML=st.host1?`${av(st.host1,'s')}<b>${esc(st.host1.name)}</b>`:'Waiting…';
  $('#pk-tag2').innerHTML=st.host2?`${av(st.host2,'s')}<b>${esc(st.host2.name)}</b>`:'Waiting…';
  const d=await api('/api/pk/token',{pk_id:pid});
  AgoraRTC.setLogLevel&&AgoraRTC.setLogLevel(3);
  const c=AgoraRTC.createClient({mode:'live',codec:'vp8'});P.client=c;
  await c.setClientRole(d.publisher?'host':'audience');
  c.on('user-published',async(u,m)=>{try{await c.subscribe(u,m);
    if(m==='video'){u.videoTrack.play((u.uid===P.h2)?'pk-v2':'pk-v1',{fit:'cover'})}
    else if(m==='audio')u.audioTrack.play()}catch(e){}});
  await c.join(d.app_id,d.channel,d.token,d.uid);
  if(P.client!==c){try{await c.leave()}catch(e){}return}
  if(d.publisher){try{const[a,v]=await AgoraRTC.createMicrophoneAndCameraTracks({AEC:true,ANS:true,AGC:true},{encoderConfig:'480p_2',facingMode:'user'});P.track=a;P.vtrack=v;
    v.play((d.uid===P.h2)?'pk-v2':'pk-v1',{mirror:true,fit:'cover'});
    try{await c.enableDualStream()}catch(e){}await c.publish([a,v]);P.pub=true;$('#pk-mic').style.display=''}catch(e){toast('📷 Camera/mic not allowed')}}
  pkPoll()}
async function pkPoll(){
  if(!P.alive)return;
  try{const d=await api('/api/pk/'+P.pid+'/state');
   const tot=(d.host1_gifts||0)+(d.host2_gifts||0);
   $('#pk-s1').textContent=fmt(d.host1_gifts);$('#pk-s2').textContent=fmt(d.host2_gifts);
   $('#pk-bl').style.width=(tot?Math.round(d.host1_gifts/tot*100):50)+'%';
   const tl=d.time_left||0;$('#pk-timer').textContent=Math.floor(tl/60)+':'+String(tl%60).padStart(2,'0');
   if(d.host2&&!P.h2){P.h2=d.host2.id;$('#pk-tag2').innerHTML=`${av(d.host2,'s')}<b>${esc(d.host2.name)}</b>`}
   if(d.status==='ended'){$('#pk-win').classList.add('on');
     const w=(d.host1&&d.winner===d.host1.id)?d.host1:d.host2;
     $('#pk-win-t').textContent=w?'🏆 '+w.name+' WINS!':'🤝 DRAW';
     $('#pk-win-s').textContent=fmt(d.host1_gifts)+' vs '+fmt(d.host2_gifts)+' · 70% / 20% / 10%';
     return}
  }catch(e){}
  P.t=setTimeout(pkPoll,2000)}
async function exitPK(){P.alive=false;clearTimeout(P.t);const c=P.client;P.client=null;P.pub=false;
  if(P.track){try{P.track.close()}catch(e){}P.track=null}
  if(P.vtrack){try{P.vtrack.close()}catch(e){}P.vtrack=null}
  if(c){try{await c.leave()}catch(e){}}
  $('#pk').classList.remove('on');$('#nav').style.display='';$('#pk-mic').style.display='none'}

   ${d.items.map(i=>{const ok=i.count>=i.goal;return `<div class="ms"><span style="font-size:26px">${i.emoji}</span><div class="sp"><div>${esc(i.name)}</div><div class="bar2" style="margin-top:5px"><i style="width:${Math.round(i.count/i.goal*100)}%"></i></div></div>${i.claimed?'<span class="win">✓</span>':ok?`<button class="btn gold sm" data-k="${i.key}">+${i.reward}</button>`:`<span class="mut">${i.count}/${i.goal}</span>`}</div>`}).join('')}
   <div class="ms"><span style="font-size:26px">🏆</span><div class="sp"><b>Finish all</b></div>${b.claimed?'<span class="win">✓</span>':b.ready?`<button class="btn gold sm" data-k="all">+${b.reward}</button>`:`<span class="mut">🪙${b.reward}</span>`}</div>`;
   $$('button[data-k]',m).forEach(btn=>btn.onclick=()=>run(btn,async()=>{const r=await api('/api/missions/claim',{key:btn.dataset.k});S.me.coins=r.coins;setMe(S.me);toast('🎉 +'+r.got);hap('medium');draw(r)}))};
  try{draw(await api('/api/missions'))}catch(e){m.close();toast(e.message)}}
async function openShop(){
  const m=modal('<div class="empty">…</div>',()=>{LOAD[PAGE]&&LOAD[PAGE]()});
  const draw=d=>{setMe(d.me);const me=d.me,cv=S.cfg.vip,days=vipLeft(me),own=new Set(d.owned);
   m.firstChild.innerHTML=`<div class="row"><h3 class="sp" style="margin:0">✨ VIP & Frames</h3><span class="pill">🪙 <span class="coins-n">${fmt(me.coins)}</span></span></div>
   <div class="card vipc" style="margin-top:12px"><div class="row"><span class="vip" style="font-size:12px;padding:2px 8px">VIP</span><b class="sp">${me.vip?days+' days left':'Exclusive perks'}</b></div>
    <div class="mut" style="margin:8px 0 10px;line-height:1.8">✨ Gold VIP badge<br>🎁 Daily +${Math.round((cv.bonus-1)*100)}%<br>🖼 2 VIP frames<br>🎙 Up to ${cv.rooms} rooms</div>
    <button class="btn gold" id="vip-go" style="width:100%">${me.vip?'Extend':'Become VIP'} · +${cv.days}d · 🪙${fmt(cv.price)}</button></div>
   <h3 style="margin:16px 0 10px;color:#fff">🖼 Frames</h3>
   <div class="fg">${S.cfg.frames.map(f=>{const have=own.has(f.key)||(f.vip&&me.vip),on=me.fr===f.key;
     return `<div class="fi ${on?'on':''}" data-k="${f.key}">${av({id:me.id,name:me.name,photo:me.photo,fr:f.key})}<div>${esc(f.name)}</div><div class="fp">${on?'✓':have?'Wear':f.vip?'🔒':'🪙'+fmt(f.price)}</div></div>`}).join('')}</div>`;
   $('#vip-go',m).onclick=e=>run(e.target,async()=>{if(!confirm('🪙'+fmt(cv.price)+' · '+cv.days+'d?'))return;draw(await api('/api/vip/buy',{}));toast('👑 VIP!');hap('heavy')});
   $$('.fi',m).forEach(e=>e.onclick=()=>{const f=S.cfg.frames.find(x=>x.key===e.dataset.k),have=own.has(f.key)||(f.vip&&me.vip);
     const act=(path,b,msg)=>run(null,async()=>{draw(await api(path,b));if(msg)toast(msg);hap()});
     if(me.fr===f.key)return act('/api/frame/equip',{key:''});
     if(have)return act('/api/frame/equip',{key:f.key},'✅');
     if(f.vip)return toast('🔒 VIP only');
     if(confirm(f.name+' 🪙'+fmt(f.price)+'?'))act('/api/frame/buy',{key:f.key},'✅')});
  };
  try{draw(await api('/api/shop'))}catch(e){m.close();toast(e.message)}}
async function openPolicy(){const m=modal('<div class="empty">…</div>');
 try{const d=await api('/api/policy');
  const titles={terms:'Terms of Service',commission:'Host & Agent Commission',lucky:'Lucky Gift',pk:'PK Battle',stage:'Live Guests',withdraw:'Withdrawal & Payments',conduct:'Community Rules',privacy:'Privacy'};
  m.firstChild.innerHTML='<h3>📜 Policy</h3>'+Object.entries(d.sections).map(([k,v])=>`<div class="card"><b>${titles[k]||k}</b><div class="mut" style="white-space:pre-wrap;margin-top:6px;font-size:12px">${esc(v)}</div></div>`).join('')+footbar()}catch(e){m.close();toast(e.message)}}
async function renderMe(){
  try{const d=await api('/api/me');setMe(d.me)}catch(e){}
  const m=S.me,pct=m.next?Math.min(100,Math.round((m.spent-m.base)/(m.next-m.base)*100)):100;
  $('#p-me').innerHTML=topbar()+`<div class="card" style="text-align:center"><div style="display:flex;justify-content:center">${av(m,'l')}</div><h2 style="margin:8px 0 2px">${esc(m.name)}</h2><span class="badge">${m.lvi} ${m.lvn}</span> ${vipTag(m)} ${hostTag(m)} ${agentTag(m)}<div class="mut" style="margin:6px 0">${esc(m.bio||'—')}</div>
  <div class="bar2"><i style="width:${pct}%"></i></div><div class="mut" style="margin-top:4px">${m.next?fmt(m.next-m.spent)+' 🪙 → next':'👑 MAX'}</div></div>
  <div class="grid2"><div class="card" style="text-align:center"><div class="mut">Gifts sent</div><b class="gold">${fmt(m.sent)}</b></div><div class="card" style="text-align:center"><div class="mut">Gifts received</div><b class="gold">${fmt(m.recv)}</b></div></div>
  <div class="col">
  ${m.host==='none'?`<button class="btn ghost" onclick="applyHost()">🎤 Become a Host (50%)</button>`:m.host==='pending'?`<button class="btn ghost" disabled>⏳ Host pending</button>`:`<button class="btn ghost" disabled>✅ Host</button>`}
  ${m.host==='host'&&!m.ag?`<button class="btn ghost" onclick="applyAgent()">🤝 Become an Agent</button>`:''}
  ${m.ag?`<button class="btn" onclick="openAgent()">📊 Agent Dashboard</button>`:''}
  <button class="btn ghost" onclick="openInvite()">🔗 Invite · ${fmt(m.inv||0)}</button>
  <button class="btn gold" onclick="openShop()">✨ VIP & Frames${m.vip?' · '+vipLeft(m)+'d':''}</button>
  <button class="btn ghost" onclick="editProfile()">✏️ Edit profile</button>
  <button class="btn ghost" onclick="openPolicy()">📜 Policy</button>
  ${m.is_admin?`<button class="btn gold" onclick="openAdmin()">🛡 Admin</button>`:''}
  </div>${footbar()}`}
function editProfile(){const m=S.me;const o=modal(`<h3>✏️ Edit profile</h3><div class="col"><input id="e-p" type="file" accept="image/*"><input id="e-n" value="${esc(m.name)}" maxlength="30"><input id="e-b" value="${esc(m.bio)}" maxlength="160"><input id="e-t" value="${esc(m.phone)}" maxlength="10" placeholder="09xxxxxxxx"><button class="btn" id="e-go">Save</button></div>`);
  $('#e-go',o).onclick=e=>run(e.target,async()=>{const f=$('#e-p',o).files[0];if(f){const fd=new FormData();fd.append('file',await shrink(f,320,.85),'p.jpg');setMe((await api('/api/profile/photo',fd)).me)}
   setMe((await api('/api/profile',{name:$('#e-n',o).value,bio:$('#e-b',o).value,phone:$('#e-t',o).value})).me);o.close();renderMe()})}
function openAdmin(){const o=modal(`<div class="chips" id="at">${['overview','finance','purchases','withdraws','users'].map((x,i)=>`<div class="chip ${i?'':'on'}" data-t="${x}">${x}</div>`).join('')}</div><div id="ab" style="margin-top:10px"></div>`);
  const load=async x=>{$$('#at .chip',o).forEach(c=>c.classList.toggle('on',c.dataset.t===x));const b=$('#ab',o);b.innerHTML='…';
   try{if(x==='overview'){const d=await api('/api/admin/overview');b.innerHTML=`<div class="grid2">${Object.entries(d).map(([k,v])=>`<div class="card" style="margin:0"><div class="mut">${k}</div><b>${fmt(v)}</b></div>`).join('')}</div>`}
   else if(x==='finance'){const [p,r,f]=await Promise.all([api('/api/fin/pnl'),api('/api/fin/reconcile'),api('/api/fin/flags')]);
     b.innerHTML=`<div class="grid2">
      <div class="card" style="margin:0"><div class="mut">Revenue (Birr)</div><b class="gold">${fmt(p.revenue_birr)}</b></div>
      <div class="card" style="margin:0"><div class="mut">Paid out</div><b>${fmt(p.paid_out_birr)}</b></div>
      <div class="card" style="margin:0"><div class="mut">Host liability</div><b>${fmt(p.host_liability_birr)}</b></div>
      <div class="card" style="margin:0"><div class="mut">Commission liability</div><b>${fmt(p.commission_liability_birr)}</b></div>
      <div class="card" style="margin:0"><div class="mut">Est. net (Birr)</div><b class="${p.estimated_net_birr>=0?'win':'lose'}">${fmt(p.estimated_net_birr)}</b></div>
      <div class="card" style="margin:0"><div class="mut">Margin % (target 30)</div><b class="${p.on_target?'win':'lose'}">${p.estimated_margin_pct}%</b></div></div>
     <div class="card" style="margin-top:10px"><div class="row"><b class="sp">Reconcile</b><span class="badge">${r.ok?'✅ OK':'⚠️ issues'}</span></div>${(r.issues||[]).map(i=>`<div class="mut">${esc(i.kind)}: ${i.count} (${esc(i.severity)})</div>`).join('')||'<div class="mut">No issues</div>'}</div>
     <div class="card"><div class="row"><b class="sp">Commission scheme</b><span class="badge">${esc(p.scheme)}</span></div><div class="mut">Lucky house: ${fmt(p.lucky_house_coins)} · Game house: ${fmt(p.game_house_coins)} · Gift volume: ${fmt(p.gift_volume_coins)}</div></div>
     <h3>Fraud flags (${(f.items||[]).length})</h3>${(f.items||[]).map(fl=>`<div class="card row"><div class="sp"><b>${esc(fl.kind)}</b><div class="mut">${esc(fl.details)}</div></div><button class="btn sm ghost" onclick="admFinFlag(${fl.id})">Resolve</button></div>`).join('')||'<div class="empty">None</div>'}`}
   else if(x==='purchases'||x==='withdraws'){const d=await api('/api/admin/'+x);b.innerHTML=d.items.map(y=>`<div class="card"><b>${esc(y.name)}</b> · ${fmt(y.coins)} 🪙 · ${fmt(y.birr)} Birr ${y.method==='usdt'?'· <span class="usdt">USDT '+(y.usdt||'')+'</span>':'· Telebirr'}<div class="mut" style="word-break:break-all">${esc(y.ref||y.address||y.phone||'')} · ${ago(y.ts)}</div><div class="row" style="margin-top:8px">${x==='purchases'?`<button class="btn ghost sm" onclick="viewShot(${y.id})">🖼</button><button class="btn sm" onclick="admAct('purchase',${y.id},'approve')">✅</button><button class="btn bad sm" onclick="admAct('purchase',${y.id},'reject')">❌</button>`:`<button class="btn sm" onclick="admAct('withdraw',${y.id},'paid')">💰</button><button class="btn bad sm" onclick="admAct('withdraw',${y.id},'reject')">❌</button>`}</div></div>`).join('')||'<div class="empty">—</div>'}
   else{b.innerHTML=`<input id="uq" placeholder="Search name / tg id"><div id="ul" style="margin-top:8px"></div>`;const ld=async()=>{const d=await api('/api/admin/users?q='+encodeURIComponent($('#uq',o).value));$('#ul',o).innerHTML=d.items.map(u=>`<div class="card"><b>${esc(u.name)}</b> ${u.banned?'🚫':''} ${u.vip?'<span class="vip">VIP</span>':''} ${u.host==='host'?'<span class="hbadge">HOST</span>':''} ${u.ag?'<span class="abadge">AGENT</span>':''}<div class="mut">tg:${u.tg} · 🪙${fmt(u.coins)} · 💰${fmt(u.earn)} · 🤝${fmt(u.comm)}</div><div class="row" style="margin-top:6px;flex-wrap:wrap"><button class="btn sm ghost" onclick="admUser(${u.id},'${u.banned?'unban':'ban'}')">${u.banned?'Unban':'Ban'}</button><button class="btn sm gold" onclick="admGrant(${u.id})">+🪙</button><button class="btn sm ghost" onclick="admVip(${u.id})">+VIP</button><button class="btn sm ${u.host==='host'?'bad':'gold'}" onclick="admUser(${u.id},'host',${u.host==='host'?0:1})">${u.host==='host'?'-Host':'+Host'}</button>${u.host==='host'?`<button class="btn sm ghost" onclick="admUser(${u.id},'agent')">${u.ag?'-Agent':'+Agent'}</button>`:''}<button class="btn sm bad" onclick="confirm('Delete?')&&admUser(${u.id},'delete')">🗑</button></div></div>`).join('')};$('#uq',o).oninput=()=>{clearTimeout(window._uq);window._uq=setTimeout(ld,350)};ld()}}catch(e){b.innerHTML=esc(e.message)}};
  $$('#at .chip',o).forEach(c=>c.onclick=()=>load(c.dataset.t));window._admLoad=load;window._admTab=()=>$('#at .chip.on',o).dataset.t;load('overview')}
const admAct=(k,id,a)=>run(null,async()=>{await api('/api/admin/'+k,{id,action:a});window._admLoad(window._admTab())});
const admUser=(id,a,amount)=>run(null,async()=>{await api('/api/admin/user',{id,action:a,amount});window._admLoad(window._admTab())});
function admVip(id){const n=prompt('VIP days (1–365)','30');if(n)admUser(id,'vip',+n)}
function admGrant(id){const n=prompt('Coins (negative allowed)');if(n)admUser(id,'grant',+n)}
async function admFinFlag(id){await run(null,async()=>{await api('/api/fin/flag',{id,action:'resolve'});window._admLoad('finance')})}
async function viewShot(id){try{const r=await fetch('/api/admin/shot/'+id,{headers:{Authorization:'Bearer '+TOKEN}});const u=URL.createObjectURL(await r.blob());modal(`<img src="${u}" style="width:100%;border-radius:12px">`)}catch(e){toast('Not found')}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&R&&R.alive){clearTimeout(R.t);poll()}if(!document.hidden)pollInvites()});
addEventListener('pagehide',()=>{if(R&&TOKEN)try{fetch('/api/rooms/'+R.id+'/exit',{method:'POST',keepalive:true,headers:{Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'},body:'{}'})}catch(e){}});
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}
(async()=>{try{await login();$('#splash').remove();go('home');pollInvites();setInterval(pollInvites,12000)}catch(e){$('#splash-t').textContent='❌ '+e.message}})();
</script>
</body>
</html>
