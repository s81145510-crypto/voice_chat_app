<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceChat</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.7/dist/livekit-client.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            padding: 15px;
            color: #fff;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        .header { text-align: center; padding: 30px 20px; }
        .logo { font-size: 60px; margin-bottom: 10px; }
        .header h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.2);
            padding: 15px 20px;
            border-radius: 16px;
            margin-bottom: 20px;
        }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar {
            width: 45px; height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: bold;
        }
        .user-name { font-weight: 600; font-size: 16px; }
        .user-id { font-size: 11px; color: rgba(255, 255, 255, 0.7); }
        .coin-badge {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            padding: 10px 18px;
            border-radius: 25px;
            font-weight: 700;
            color: #333;
            font-size: 16px;
        }
        .input-group { margin: 15px 0; }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }
        .input-group input, .chat-input input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        .input-group input::placeholder, .chat-input input::placeholder { color: rgba(255, 255, 255, 0.5); }
        .btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
        }
        .btn-success {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: #333;
        }
        .btn-danger { background: #ff4757; }
        .section-title { font-size: 20px; font-weight: 700; margin-bottom: 15px; }
        .gifts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 15px;
        }
        .gift-card {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
        }
        .gift-icon { font-size: 40px; margin-bottom: 8px; display: block; }
        .gift-price { font-weight: 700; font-size: 14px; color: #ffd700; }
        .gift-name { font-size: 11px; color: rgba(255, 255, 255, 0.8); }
        .room-card {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .room-icon {
            width: 50px; height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
        }
        .room-info { flex: 1; }
        .room-name { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
        .room-meta { font-size: 12px; color: rgba(255, 255, 255, 0.7); }
        .hidden { display: none !important; }

        .room-top {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 14px; gap: 10px;
        }
        .room-top .t { font-size: 18px; font-weight: 700; }
        .room-top .c { font-size: 13px; color: rgba(255,255,255,0.8); }
        .exit-btn {
            background: #ff4757; border: none; color: #fff;
            padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px;
        }
        .seat-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 10px; margin-bottom: 14px;
        }
        .seat {
            background: rgba(255,255,255,0.12);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 18px;
            padding: 12px 6px;
            text-align: center;
            min-height: 108px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .seat.mine { border-color: #ffd700; }
        .seat.speaking { border-color: #43e97b; box-shadow: 0 0 14px #43e97b; }
        .seat .pic {
            width: 56px; height: 56px; border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold; overflow: hidden; position: relative;
        }
        .seat .pic img { width: 100%; height: 100%; object-fit: cover; }
        .seat .empty { font-size: 34px; opacity: 0.7; }
        .seat .sname {
            font-size: 12px; margin-top: 6px; max-width: 100%;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .seat .crown { font-size: 16px; line-height: 1; margin-bottom: 2px; }
        .seat .num { font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 4px; }

        .chat-box {
            background: rgba(0,0,0,0.18); border-radius: 16px;
            padding: 12px; height: 190px; overflow-y: auto; margin-bottom: 10px;
            font-size: 14px;
        }
        .msg { margin-bottom: 6px; word-break: break-word; }
        .msg .n { color: #feca57; font-weight: 600; }
        .msg.sys { color: rgba(255,255,255,0.65); font-size: 12px; }
        .chat-input { display: flex; gap: 8px; }
        .chat-input input { padding: 12px 16px; }
        .chat-input button {
            border: none; border-radius: 14px; padding: 0 18px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #fff; font-size: 18px;
        }
        .toast {
            position: fixed; top: 20px; left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(0, 0, 0, 0.9); color: white;
            padding: 15px 25px; border-radius: 12px; font-size: 14px;
            z-index: 1000; transition: transform 0.3s;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { background: rgba(67, 233, 123, 0.9); color: #333; }
        .toast.error { background: rgba(255, 71, 87, 0.9); }
    </style>
</head>
<body>
    <div id="toast" class="toast"></div>
    <div class="container">
        <div id="register-section">
            <div class="card header">
                <div class="logo">🎙️</div>
                <h1>VoiceChat</h1>
                <p>የድምፅ ቻት ማህበረሰብ</p>
            </div>
            <div class="card">
                <div class="section-title">👋 እንኳን ደህና መጣህ</div>
                <p id="login-msg">በመግባት ላይ...</p>
                <button class="btn" onclick="register()">🚀 ጀምር</button>
            </div>
        </div>

        <div id="main-section" class="hidden">
            <div class="user-bar">
                <div class="user-info">
                    <div class="avatar" id="user-avatar">👤</div>
                    <div>
                        <div class="user-name" id="user-display">-</div>
                        <div class="user-id" id="user-id-display">-</div>
                    </div>
                </div>
                <div class="coin-badge">🪙 <span id="coin-balance">0</span></div>
            </div>

            <div id="lobby">
                <div class="card">
                    <div class="section-title">🏠 አዲስ ክፍል ፍጠር</div>
                    <div class="input-group">
                        <label>የክፍሉ ስም</label>
                        <input type="text" id="room-name" placeholder="ለምሳሌ፡ ሙዚቃ፣ ዜና...">
                    </div>
                    <button class="btn btn-success" onclick="createRoom()">✨ ክፍል ፍጠር</button>
                </div>
                <div class="card">
                    <div class="section-title">📢 ክፍሎች</div>
                    <div id="rooms-list"></div>
                </div>
                <div class="card">
                    <div class="section-title">🎁 ስጦታ ላክ</div>
                    <div class="input-group">
                        <label>የተቀባይ ID</label>
                        <input type="text" id="recipient-id" placeholder="tg_123456789">
                    </div>
                    <div class="gifts-grid">
                        <div class="gift-card" onclick="sendGift('coffee')">
                            <span class="gift-icon">☕</span>
                            <div class="gift-price">10 🪙</div>
                            <div class="gift-name">ቡና</div>
                        </div>
                        <div class="gift-card" onclick="sendGift('rose')">
                            <span class="gift-icon">🌹</span>
                            <div class="gift-price">50 🪙</div>
                            <div class="gift-name">ሮዝ</div>
                        </div>
                        <div class="gift-card" onclick="sendGift('car')">
                            <span class="gift-icon">🚗</span>
                            <div class="gift-price">1000 🪙</div>
                            <div class="gift-name">መኪና</div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="room-view" class="hidden">
                <div class="card">
                    <div class="room-top">
                        <div>
                            <div class="t" id="rv-title">🎙️</div>
                            <div class="c" id="rv-count"></div>
                        </div>
                        <button class="exit-btn" onclick="leaveRoom()">🚪 ውጣ</button>
                    </div>
                    <div class="seat-grid" id="seat-grid"></div>
                    <button class="btn btn-success hidden" id="mic-btn" onclick="toggleMute()">🎤 ማይክ</button>
                    <button class="btn btn-danger hidden" id="stand-btn" onclick="leaveSeat()" style="margin-bottom:12px;">⬇️ ከመቀመጫ ተነሳ</button>
                </div>
                <div class="card">
                    <div class="chat-box" id="chat-box"></div>
                    <div class="chat-input">
                        <input type="text" id="chat-text" maxlength="200" placeholder="መልዕክት ጻፍ...">
                        <button onclick="sendChat()">➤</button>
                    </div>
                </div>
                <div id="audio-box"></div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        let userId = null, username = null;
        let lkRoom = null, inRoom = null, hostId = null;
        let lastMsg = 0, lastSeats = {}, mySeat = null;
        let muted = false, speaking = new Set(), pollTimer = null, micBusy = false;

        function hdrs() {
            return {
                'Content-Type': 'application/json',
                'X-Telegram-Init-Data': tg ? tg.initData : ''
            };
        }
        function esc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        function showToast(msg, type='success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show ' + type;
            setTimeout(() => t.className = 'toast', 3000);
        }
        async function api(path, method, body) {
            const opt = { method: method || 'POST', headers: hdrs() };
            if (opt.method !== 'GET') opt.body = JSON.stringify(body || {});
            const r = await fetch(path, opt);
            return r.json();
        }

        async function register() {
            if (!tg || !tg.initData) {
                document.getElementById('login-msg').textContent = '⚠️ ይህን መተግበሪያ ከቴሌግራም ቦት ውስጥ ክፈት።';
                showToast('⚠️ ከቴሌግራም ውስጥ ክፈት!', 'error');
                return;
            }
            try {
                const d = await api('/api/register', 'POST', {});
                if (d.success) {
                    userId = d.user_id;
                    username = d.user.username;
                    document.getElementById('register-section').classList.add('hidden');
                    document.getElementById('main-section').classList.remove('hidden');
                    document.getElementById('user-display').textContent = username;
                    document.getElementById('user-id-display').textContent = userId;
                    document.getElementById('user-avatar').textContent = username.charAt(0).toUpperCase();
                    document.getElementById('coin-balance').textContent = d.user.coins;
                    loadRooms();
                    showToast('🎉 እንኳን ደህና መጣህ ' + username + '!');
                } else {
                    showToast('❌ ' + (d.error || 'ስህተት'), 'error');
                }
            } catch (e) { showToast('❌ ስህተት', 'error'); }
        }

        async function createRoom() {
            const name = document.getElementById('room-name').value.trim();
            if (!name) { showToast('⚠️ የክፍል ስም አስገባ!', 'error'); return; }
            const roomId = 'room_' + Math.random().toString(36).substr(2, 9);
            try {
                const d = await api('/api/rooms/create', 'POST', {room_id: roomId, room_name: name});
                if (d.success) {
                    document.getElementById('room-name').value = '';
                    showToast('✅ ክፍል ተፈጥሯል!');
                    joinRoom(roomId);
                } else {
                    showToast('❌ ' + (d.error || 'ስህተት'), 'error');
                }
            } catch (e) { showToast('❌ ስህተት', 'error'); }
        }

        async function loadRooms() {
            if (inRoom) return;
            try {
                const r = await fetch('/api/rooms');
                const rooms = await r.json();
                const list = document.getElementById('rooms-list');
                if (Object.keys(rooms).length === 0) {
                    list.innerHTML = '<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.6);"><div style="font-size:60px;">🔇</div><p>ገና ምንም ክፍል የለም</p></div>';
                    return;
                }
                let html = '';
                for (const [rid, room] of Object.entries(rooms)) {
                    html += '<div class="room-card"><div class="room-icon">🎙️</div><div class="room-info"><div class="room-name">'
                        + esc(room.name) + '</div><div class="room-meta">👤 '
                        + esc(room.creator_name) + ' · 👥 ' + room.count + '</div></div>'
                        + '<button class="btn" style="width:auto;padding:10px 16px;margin:0;" onclick="joinRoom(\'' + esc(rid) + '\')">ግባ</button></div>';
                }
                list.innerHTML = html;
            } catch (e) {}
        }

        async function sendGift(type) {
            const to = document.getElementById('recipient-id').value.trim();
            if (!to) { showToast('⚠️ የተቀባይ ID አስገባ!', 'error'); return; }
            const names = {coffee: '☕ ቡና', rose: '🌹 ሮዝ', car: '🚗 መኪና'};
            try {
                const d = await api('/api/gifts/send', 'POST', {gift_type: type, recipient_id: to});
                if (d.success) {
                    showToast('🎁 ' + names[type] + ' ተልኳል!');
                    document.getElementById('coin-balance').textContent = d.remaining_coins;
                    document.getElementById('recipient-id').value = '';
                } else {
                    showToast('❌ ' + d.error, 'error');
                }
            } catch (e) { showToast('❌ ስህተት', 'error'); }
        }

        /* ---------- ክፍል ---------- */
        async function joinRoom(roomId) {
            if (inRoom) await leaveRoom();
            try {
                const d = await api('/api/livekit-token', 'POST', {room_id: roomId});
                if (!d.success) { showToast('❌ ' + d.error, 'error'); return; }
                lkRoom = new LivekitClient.Room();
                lkRoom.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
                    if (track.kind === 'audio') {
                        document.getElementById('audio-box').appendChild(track.attach());
                    }
                });
                lkRoom.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track) => {
                    track.detach().forEach(el => el.remove());
                });
                lkRoom.on(LivekitClient.RoomEvent.ActiveSpeakersChanged, (sp) => {
                    speaking = new Set(sp.map(s => s.identity));
                    renderSeats();
                });
                await lkRoom.connect(d.url, d.token);
                await lkRoom.startAudio();
            } catch (e) {
                showToast('❌ መግባት አልተሳካም', 'error');
                lkRoom = null;
                return;
            }
            inRoom = roomId;
            lastMsg = 0; lastSeats = {}; mySeat = null; muted = false;
            document.getElementById('chat-box').innerHTML = '';
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('room-view').classList.remove('hidden');
            await pollState();
            pollTimer = setInterval(pollState, 2000);
            window.scrollTo(0, 0);
        }

        async function leaveRoom() {
            const rid = inRoom;
            inRoom = null;
            if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
            if (lkRoom) { try { await lkRoom.disconnect(); } catch (e) {} lkRoom = null; }
            document.getElementById('audio-box').innerHTML = '';
            document.getElementById('room-view').classList.add('hidden');
            document.getElementById('lobby').classList.remove('hidden');
            if (rid) { try { await api('/api/rooms/' + rid + '/exit', 'POST', {}); } catch (e) {} }
            loadRooms();
        }

        async function pollState() {
            if (!inRoom) return;
            try {
                const d = await api('/api/rooms/' + inRoom + '/state?since=' + lastMsg, 'GET');
                if (!d.success) {
                    showToast('❌ ክፍሉ የለም', 'error');
                    leaveRoom();
                    return;
                }
                hostId = d.host;
                lastSeats = d.seats;
                document.getElementById('rv-title').textContent = '🎙️ ' + d.name;
                document.getElementById('rv-count').textContent = '👥 ' + d.count + ' ሰው';
                mySeat = null;
                for (const [k, s] of Object.entries(d.seats)) {
                    if (s.uid === userId) mySeat = parseInt(k);
                }
                renderSeats();
                appendMessages(d.messages);
                syncMic();
            } catch (e) {}
        }

        function renderSeats() {
            const grid = document.getElementById('seat-grid');
            let html = '';
            for (let i = 0; i < 9; i++) {
                const s = lastSeats[String(i)];
                if (s) {
                    const cls = 'seat' + (s.uid === userId ? ' mine' : '') + (speaking.has(s.uid) ? ' speaking' : '');
                    const pic = s.photo
                        ? '<img src="' + esc(s.photo) + '">'
                        : esc((s.name || '?').charAt(0).toUpperCase());
                    html += '<div class="' + cls + '" onclick="seatClick(' + i + ')">'
                        + (i === 0 ? '<div class="crown">👑</div>' : '')
                        + '<div class="pic">' + pic + '</div>'
                        + '<div class="sname">' + esc(s.name) + '</div></div>';
                } else {
                    html += '<div class="seat" onclick="seatClick(' + i + ')">'
                        + '<div class="empty">' + (i === 0 ? '👑' : '🛋️') + '</div>'
                        + '<div class="num">' + (i === 0 ? 'host' : (i + 1)) + '</div></div>';
                }
            }
            grid.innerHTML = html;
            document.getElementById('mic-btn').classList.toggle('hidden', mySeat === null);
            document.getElementById('stand-btn').classList.toggle('hidden', mySeat === null);
            document.getElementById('mic-btn').textContent = muted ? '🎤 ማይክ አብራ' : '🔇 ማይክ አጥፋ';
        }

        async function seatClick(i) {
            const s = lastSeats[String(i)];
            if (s && s.uid === userId) { leaveSeat(); return; }
            if (s) { showToast('መቀመጫው ተይዟል', 'error'); return; }
            try {
                const d = await api('/api/rooms/' + inRoom + '/seat', 'POST', {seat: i});
                if (!d.success) { showToast('❌ ' + d.error, 'error'); return; }
                muted = false;
                await pollState();
            } catch (e) { showToast('❌ ስህተት', 'error'); }
        }

        async function leaveSeat() {
            try {
                await api('/api/rooms/' + inRoom + '/leave-seat', 'POST', {});
                await pollState();
            } catch (e) {}
        }

        async function syncMic() {
            if (!lkRoom || micBusy) return;
            const want = (mySeat !== null) && !muted;
            const cur = lkRoom.localParticipant.isMicrophoneEnabled;
            if (want === cur) return;
            micBusy = true;
            try {
                await lkRoom.localParticipant.setMicrophoneEnabled(want);
            } catch (e) {
                if (want) {
                    showToast('❌ ማይክ ፈቃድ አልተሰጠም', 'error');
                    muted = true;
                    renderSeats();
                }
            }
            micBusy = false;
        }

        function toggleMute() {
            muted = !muted;
            renderSeats();
            syncMic();
        }

        function appendMessages(msgs) {
            if (!msgs || !msgs.length) return;
            const box = document.getElementById('chat-box');
            let html = '';
            for (const m of msgs) {
                lastMsg = Math.max(lastMsg, m.id);
                if (m.sys) html += '<div class="msg sys">' + esc(m.text) + '</div>';
                else html += '<div class="msg"><span class="n">' + esc(m.name) + ':</span> ' + esc(m.text) + '</div>';
            }
            box.insertAdjacentHTML('beforeend', html);
            box.scrollTop = box.scrollHeight;
        }

        async function sendChat() {
            const inp = document.getElementById('chat-text');
            const text = inp.value.trim();
            if (!text || !inRoom) return;
            inp.value = '';
            try {
                await api('/api/rooms/' + inRoom + '/chat', 'POST', {text: text});
                pollState();
            } catch (e) {}
        }
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('chat-text').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') sendChat();
            });
        });

        setInterval(loadRooms, 5000);
        register();
    </script>
</body>
</html>
