<!DOCTYPE html>
<html lang="am"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VoiceChat</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.7/dist/livekit-client.umd.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0b0b18;color:#fff;font-family:system-ui,'Noto Sans Ethiopic',sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
button,input,textarea{font:inherit;color:inherit}
input,textarea{width:100%;background:#151530;border:1px solid #2a2a50;border-radius:12px;padding:11px;margin:5px 0;outline:0}
button{border:0;border-radius:12px;padding:10px 14px;background:#7c3aed;cursor:pointer}
button.g{background:#1b1b38}button.r{background:#4a1520;color:#ff9aa8}button.ok{background:#14803c}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.coin{background:#2b2210;border:1px solid #6b5420;color:#ffd24a;padding:6px 12px;border-radius:20px;font-weight:700}
.card{background:#12122a;border:1px solid #24244a;border-radius:18px;padding:14px;margin:10px 14px}
.hero{background:linear-gradient(135deg,#3b1d8f,#b0155f)}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.f1{flex:1}
.grid{display:grid;gap:8px}.c2{grid-template-columns:1fr 1fr}.c4{grid-template-columns:repeat(4,1fr)}.c5{grid-template-columns:repeat(5,1fr)}
.muted{color:#9aa}.small{font-size:12px}.big{font-size:34px;font-weight:800}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0f0f22;border-top:1px solid #24244a;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav button{flex:1;background:0;border-radius:0;font-size:11px;padding:8px 2px;color:#889}nav button.on{color:#fff}nav b{display:block;font-size:20px;font-weight:400}
#room{position:fixed;inset:0;background:linear-gradient(#2a1a55,#0b0b18 40%);z-index:30;overflow:auto;padding:10px 12px calc(20px + env(safe-area-inset-bottom,0px));display:none}
.seat{background:#151530;border:2px solid #25254a;border-radius:16px;text-align:center;padding:8px 2px;min-height:78px;font-size:11px;position:relative;cursor:pointer}
.sofa{background:linear-gradient(160deg,#27458a,#16254f);border-color:#3d5fb0}
.sofa .e{font-size:30px;filter:drop-shadow(0 2px 3px #000)}
.throne{background:linear-gradient(160deg,#7a5a00,#2a1e00);border-color:#ffc83d;box-shadow:0 0 18px #ffc83d66;min-height:120px;width:46%;margin:0 auto 10px}
.throne .e{font-size:42px}
.av{width:44px;height:44px;border-radius:50%;margin:0 auto 3px;background:#19c3a5;display:flex;align-items:center;justify-content:center;font-weight:800;background-size:cover}
.throne .av{width:62px;height:62px;border:3px solid gold}
.spk{border-color:#3dff9a!important;box-shadow:0 0 12px #3dff9a88}
.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
#chat{background:#12122a;border-radius:16px;height:190px;overflow:auto;padding:10px;margin:10px 0;font-size:14px}
#chat div{margin-bottom:4px}.sys{color:#c9a0ff}
#mini{position:fixed;left:10px;right:10px;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:#2a1a55;border:1px solid #7c3aed;border-radius:16px;padding:8px 12px;z-index:21;display:none}
#modal{position:fixed;inset:0;background:#000a;z-index:50;display:none;align-items:flex-end}
#modal>div{background:#12122a;width:100%;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#333;padding:10px 16px;border-radius:12px;z-index:99;display:none;max-width:90%}
.gift{background:#1b1b38;border-radius:12px;padding:8px 2px;text-align:center;font-size:11px}.gift i{font-style:normal;font-size:26px;display:block}
.tag{padding:2px 8px;border-radius:8px;font-size:11px;background:#333}.pending{background:#6b5420}.approved,.paid{background:#14803c}.rejected{background:#7a1c2c}
img.shot{width:100%;border-radius:10px;margin:6px 0}
</style></head><body>
<div id="toast"></div><div id="modal"></div>
<div id="app"></div>
<div id="mini"></div>
<nav id="nav"></nav>
<div id="room"></div>
<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand()}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ME=null,CFG=null,ADMIN=false,TAB='home',R=null,POLL=null,SEL=null,AU={};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
async function api(p,b,raw){
  const o={headers:{'X-Telegram-Init-Data':tg?tg.initData:''}};
  if(b!==undefined){o.method='POST';o.headers['Content-Type']='application/json';o.body=JSON.stringify(b)}
  let r;try{r=await fetch(p,o)}catch(e){return{success:false,error:'ኔትዎርክ የለም'}}
  if(raw&&(r.headers.get('content-type')||'').startsWith('image'))return r;
  let j;try{j=await r.json()}catch(e){j={success:false,error:'ስህተት'}}
  if(j.banned)document.body.innerHTML='<h2 style="padding:60px 20px;text-align:center">🚫 ታግደዋል</h2>';
  return j}
const val=id=>($('#'+id)||{}).value||'';
function modal(h){const m=$('#modal');if(!h){m.style.display='none';m.innerHTML='';return}m.innerHTML='<div>'+h+'</div>';m.style.display='flex'}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')modal()});
const av=(n,p)=>`<div class="av" style="${p?`background-image:url('${esc(p)}')`:''}">${p?'':esc((n||'?').slice(0,2).toUpperCase())}</div>`;
const when=s=>(s||'').replace('T',' ').slice(5,16);
const st=s=>`<span class="tag ${s}">${{pending:'በመጠባበቅ',approved:'ጸድቋል',paid:'ተከፍሏል',rejected:'ውድቅ'}[s]||s}</span>`;

/* ---------- ጅምር ---------- */
async function init(){
  const r=await api('/api/register',{});
  if(!r.success){$('#app').innerHTML='<p style="padding:40px;text-align:center">ይህን መተግበሪያ ከTelegram ቦት ክፈት</p>';return}
  ME=r;CFG=r.config;ADMIN=r.admin;go('home');
}
const TABS=[['home','🏠','ቤት'],['jobs','💼','ሥራ'],['comm','👥','ማኅበረሰብ'],['wallet','👛','ዋሌት'],['profile','👤','ፕሮፋይል']];
function go(t){TAB=t;
  const tabs=ADMIN?TABS.concat([['admin','🛡️','አድሚን']]):TABS;
  $('#nav').innerHTML=tabs.map(x=>`<button class="${x[0]===t?'on':''}" data-a="go" data-t="${x[0]}"><b>${x[1]}</b>${x[2]}</button>`).join('');
  $('#app').innerHTML='';$('#room').style.display='none';
  ({home:vHome,jobs:vJobs,comm:vComm,wallet:vWallet,profile:vProfile,admin:vAdmin})[t]();
  renderMini()}
const head=()=>`<div class="top"><b style="font-size:20px">🎙️ VoiceChat</b><span class="coin">🪙 ${ME.user.coins}</span></div>`;

/* ---------- ቤት ---------- */
async function vHome(){
  $('#app').innerHTML=head()+`<div class="card"><b>አዲስ ክፍል ክፈት</b><input id="rn" placeholder="የክፍል ስም" maxlength="50"><button data-a="mk" style="width:100%">➕ ክፈት</button></div><div id="rl" class="muted" style="padding:0 14px">...</div>`;
  const rs=await api('/api/rooms');if(TAB!=='home')return;
  const ids=Object.keys(rs);
  $('#rl').innerHTML=ids.length?ids.map(i=>`<div class="card row sp" style="margin:8px 0"><div><b>${esc(rs[i].name)}</b><div class="small muted">👑 ${esc(rs[i].creator_name)} · 👥 ${rs[i].count}</div></div><button data-a="enter" data-id="${esc(i)}">ግባ</button></div>`).join(''):'ክፍል የለም';
}
/* ---------- ክፍል ---------- */
async function mk(){const n=val('rn').trim();if(!n)return toast('ስም ጻፍ');
  const id='r'+Math.random().toString(36).slice(2,10);
  const r=await api('/api/rooms/create',{room_id:id,room_name:n});r.success?enter(id):toast(r.error)}
async function enter(id){
  if(R&&R.id===id){showRoom();return}
  if(R)await leaveRoom();
  R={id,since:0,name:'',host:'',seats:{},msgs:[],count:0,muted:false,speak:new Set(),mic:null};
  showRoom();
  const t=await api('/api/livekit-token',{room_id:id});
  if(t.success&&t.url&&window.LivekitClient){
    try{const L=LivekitClient;const lk=new L.Room({audioCaptureDefaults:{echoCancellation:true,noiseSuppression:true}});
      lk.on(L.RoomEvent.TrackSubscribed,(tr)=>{if(tr.kind==='audio'){const el=tr.attach();el.dataset.lk=1;document.body.appendChild(el)}});
      lk.on(L.RoomEvent.TrackUnsubscribed,tr=>tr.detach().forEach(e=>e.remove()));
      lk.on(L.RoomEvent.ActiveSpeakersChanged,s=>{R.speak=new Set(s.map(x=>x.identity));drawSeats()});
      await lk.connect(t.url,t.token);R.lk=lk;syncMic()}catch(e){toast('ድምጽ መገናኘት አልተቻለም')}
  }else if(!t.success)toast(t.error||'ስህተት');
  clearInterval(POLL);POLL=setInterval(poll,2000);poll()}
async function poll(){
  if(!R)return;const id=R.id;
  const s=await api(`/api/rooms/${id}/state?since=${R.since}`);
  if(!R||R.id!==id)return;
  if(!s.success){if(s.error==='Room not found'){toast('ክፍሉ ተዘግቷል');await exitRoom(true)}return}
  R.name=s.name;R.host=s.host;R.seats=s.seats;R.count=s.count;ME.user.coins=s.coins;ME.user.earnings=s.earnings;
  s.messages.forEach(m=>{R.msgs.push(m);R.since=Math.max(R.since,m.id)});R.msgs=R.msgs.slice(-100);
  if(R.open)drawRoom();renderMini();syncMic()}
const mySeat=()=>R&&Object.keys(R.seats).find(k=>R.seats[k].uid===ME.user_id);
function syncMic(){if(!R||!R.lk)return;const want=mySeat()!==undefined&&!R.muted;
  if(R.mic!==want){R.mic=want;R.lk.localParticipant.setMicrophoneEnabled(want).catch(()=>{R.mic=null})}}
function showRoom(){R.open=true;$('#room').style.display='block';$('#room').innerHTML=`
<div class="row sp"><div><b id="rt"></b><div class="small muted" id="rc"></div></div><div class="row"><button class="g" data-a="min">⬇️ ሚኒማይዝ</button><button class="r" data-a="exit">🚪 ውጣ</button></div></div>
<div id="seats" style="margin-top:12px"></div>
<div class="row"><button class="g f1" id="mb" data-a="mute"></button><button class="r f1" data-a="down">⬇️ ተነሳ</button></div>
<div id="chat"></div><div class="row"><input id="ci" placeholder="መልእክት..." maxlength="200" class="f1"><button data-a="say">➤</button></div>`;
  drawRoom();renderMini()}
function drawRoom(){if(!R)return;$('#rt').textContent='🎙️ '+R.name;$('#rc').textContent='👥 '+R.count+' ሰው';
  $('#mb').textContent=R.muted?'🎤 ማይክ ክፈት':'🔇 ማይክ አጥፋ';drawSeats();
  const c=$('#chat'),b=c.scrollTop+c.clientHeight>=c.scrollHeight-30;
  c.innerHTML=R.msgs.map(m=>m.sys?`<div class="sys">${esc(m.text)}</div>`:`<div><b style="color:#b79cff">${esc(m.name)}:</b> ${esc(m.text)}</div>`).join('');
  if(b)c.scrollTop=c.scrollHeight}
function seatHtml(i){const s=R.seats[i],th=i===0;
  const cls='seat '+(th?'throne':'sofa')+(s&&R.speak.has(s.uid)?' spk':'');
  const body=s?av(s.name,s.photo)+`<div class="nm">${esc(s.name)}</div>`:`<div class="e">${th?'👑':'🛋️'}</div><div>${th?'የባለቤት ዙፋን':i}</div>`;
  return `<div class="${cls}" data-a="seat" data-i="${i}">${s&&th?'<div>👑</div>':''}${body}</div>`}
function drawSeats(){const e=$('#seats');if(!e||!R)return;let h=seatHtml(0)+'<div class="grid c4">';for(let i=1;i<=20;i++)h+=seatHtml(i);e.innerHTML=h+'</div>'}
async function seat(i){const s=R.seats[i];
  if(s&&s.uid!==ME.user_id)return giftSheet(s.uid,s.name);
  if(s)return;const r=await api(`/api/rooms/${R.id}/seat`,{seat:+i});r.success?poll():toast(r.error)}
async function say(){const t=val('ci').trim();if(!t||!R)return;$('#ci').value='';const r=await api(`/api/rooms/${R.id}/chat`,{text:t});r.success?poll():toast(r.error)}
async function down(){await api(`/api/rooms/${R.id}/leave-seat`,{});R.mic=null;poll()}
function giftSheet(uid,name){modal(`<b>🎁 ለ ${esc(name)} ስጦታ ላክ</b> <span class="coin" style="float:right">🪙 ${ME.user.coins}</span><div class="grid c4" style="margin-top:12px">${CFG.gifts.map(g=>`<div class="gift" data-a="gift" data-g="${g.id}" data-u="${esc(uid)}"><i>${g.icon}</i>${esc(g.name)}<br>🪙${g.price}</div>`).join('')}</div>`)}
async function gift(d){const r=await api(`/api/rooms/${R.id}/gift`,{gift_type:d.g,recipient_id:d.u});
  if(r.success){ME.user.coins=r.remaining_coins;modal();poll();toast('ተልኳል 🎁')}
  else{toast(r.error);if(r.need_coins){modal();minimize();go('wallet')}}}
function minimize(){if(!R)return;R.open=false;$('#room').style.display='none';renderMini()}
function renderMini(){const m=$('#mini');if(!R||R.open){m.style.display='none';return}
  m.style.display='block';m.innerHTML=`<div class="row sp"><div data-a="enter" data-id="${esc(R.id)}" class="f1">🎙️ <b>${esc(R.name||'ክፍል')}</b> <span class="small muted">· 👥${R.count} · ክፈት ⬆️</span></div><button class="g" data-a="mute">${R.muted?'🎤':'🔇'}</button><button class="r" data-a="exit">✖</button></div>`}
async function leaveRoom(){const r=R;if(!r)return;clearInterval(POLL);R=null;
  try{r.lk&&await r.lk.disconnect()}catch(e){}document.querySelectorAll('audio[data-lk]').forEach(e=>e.remove());
  await api(`/api/rooms/${r.id}/exit`,{})}
async function exitRoom(){await leaveRoom();$('#room').style.display='none';$('#mini').style.display='none';if(TAB==='home')vHome()}

/* ---------- ዋሌት (Telebirr ብቻ) ---------- */
async function vWallet(){
  const u=ME.user;
  $('#app').innerHTML=head()+`<div class="card hero"><div class="small">የእኔ ሳንቲም</div><div class="big">🪙 ${u.coins}</div><div class="row" style="margin-top:8px"><div class="card f1" style="margin:0;background:#fff2"><div class="small">የተገኘ ገቢ</div><b>${u.earnings}</b></div><div class="card f1" style="margin:0;background:#fff2"><div class="small">የእኔ መታወቂያ</div><b>${esc(ME.user_id)}</b></div></div></div>
  <div class="card"><b>💰 ሳንቲም ግዛ</b><div class="small muted">ክፍያ በTelebirr ብቻ</div><div class="grid c2" style="margin-top:10px">${CFG.packages.map(p=>`<div class="card" style="margin:0;text-align:center" data-a="pkg" data-id="${p.id}"><b style="color:#ffd24a;font-size:20px">🪙 ${p.coins.toLocaleString()}</b><div class="muted">${p.price.toLocaleString()} ብር</div></div>`).join('')}</div></div>
  <div class="card"><b>💸 ገንዘብ አውጣ</b><div class="small muted">1 ገቢ = ${CFG.rate} ብር · ዝቅተኛ ${CFG.min_withdraw} · መድረኩ ${CFG.fee_percent}% ይቆርጣል (በስጦታ ጊዜ)</div>
  <input id="wp" placeholder="Telebirr ቁጥር 09xxxxxxxx" value="${esc(u.phone)}" inputmode="tel"><input id="wn" placeholder="በTelebirr ላይ ያለ ስም"><input id="wa" type="number" placeholder="የገቢ መጠን (${CFG.min_withdraw}+)">
  <button data-a="wd" style="width:100%">አውጣ</button></div><div id="hist"></div>`;
  const w=await api('/api/wallet');if(TAB!=='wallet'||!w.success)return;
  ME.user=w.user;
  $('#hist').innerHTML=`<div class="card"><b>የግዢ ታሪክ</b>${w.purchases.map(p=>`<div class="row sp small" style="margin-top:6px"><span>🪙${p.coins} · ${p.price} ብር · ${when(p.created)}</span>${st(p.status)}</div>`).join('')||'<div class="muted small">የለም</div>'}</div>
  <div class="card"><b>የማውጣት ታሪክ</b>${w.withdrawals.map(x=>`<div class="row sp small" style="margin-top:6px"><span>${x.amount} → ${x.birr} ብር · ${when(x.created)}</span>${st(x.status)}</div>`).join('')||'<div class="muted small">የለም</div>'}</div>`}
function pkg(d){const p=CFG.packages.find(x=>x.id===d.id);SEL=p;
  modal(`<b>🪙 ${p.coins.toLocaleString()} ሳንቲም — ${p.price.toLocaleString()} ብር</b>
  <div class="card" style="margin:12px 0;background:#2b2210"><div class="small">በTelebirr ወደዚህ ላክ፦</div><div class="big" style="font-size:26px;color:#ffd24a" data-a="copy">${CFG.telebirr.number}</div><div>ስም፦ <b>${esc(CFG.telebirr.name)}</b></div><div class="small muted">⚠️ ከመላክዎ በፊት ስሙ ${esc(CFG.telebirr.name)} መሆኑን ያረጋግጡ</div></div>
  <input id="ref" placeholder="Transaction ID (የግብይት ቁጥር)" maxlength="20"><input id="shot" type="file" accept="image/*">
  <div class="row"><button class="g f1" data-a="close">ተመለስ</button><button class="ok f1" data-a="buy">ላክ</button></div>`)}
async function buy(){const f=$('#shot').files[0];if(!f)return toast('ስክሪንሾት ምረጥ');
  const shot=await shrink(f);const r=await api('/api/coins/buy',{package_id:SEL.id,ref:val('ref'),shot});
  if(r.success){modal();toast('ተልኳል፤ አድሚን እስኪያጸድቅ ይጠብቁ ✅');vWallet()}else toast(r.error)}
function shrink(f){return new Promise(res=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1100/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.src=URL.createObjectURL(f)})}
async function wd(){const r=await api('/api/withdraw',{phone:val('wp'),acc_name:val('wn'),amount:val('wa')});
  if(r.success){toast('ጥያቄ ተልኳል ✅');ME.user.earnings=r.earnings;vWallet()}else toast(r.error)}

/* ---------- ፕሮፋይል ---------- */
function vProfile(){const u=ME.user;
  $('#app').innerHTML=head()+`<div class="card" style="text-align:center">${av(u.username,u.photo)}<b>${esc(u.username)}</b><div class="small muted">${esc(ME.user_id)}</div></div>
  <div class="card"><input id="pn" value="${esc(u.username)}" placeholder="ስም" maxlength="30"><textarea id="pb" rows="3" placeholder="ስለ እኔ" maxlength="150">${esc(u.bio)}</textarea><input id="pp" value="${esc(u.phone)}" placeholder="Telebirr ቁጥር (አማራጭ)"><button data-a="psave" style="width:100%">አስቀምጥ</button></div>
  <div class="card"><div class="row sp"><span>🪙 ሳንቲም</span><b>${u.coins}</b></div><div class="row sp"><span>💵 ገቢ</span><b>${u.earnings}</b></div><div class="row sp"><span>📅 የተቀላቀሉት</span><b>${when(u.joined)}</b></div></div>`}
async function psave(){const r=await api('/api/profile',{name:val('pn'),bio:val('pb'),phone:val('pp')});if(r.success){ME.user=r.user;toast('ተቀምጧል ✅');vProfile()}else toast(r.error)}

/* ---------- ሥራ ---------- */
async function vJobs(){
  $('#app').innerHTML=head()+`<div class="card"><b>💼 ሥራ ለጥፍ</b><input id="jt" placeholder="ርዕስ" maxlength="80"><textarea id="jd" rows="2" placeholder="ዝርዝር" maxlength="500"></textarea><input id="jc" placeholder="ማግኛ (ስልክ/@username)" maxlength="100"><button data-a="jpost" style="width:100%">ለጥፍ</button></div><div id="jl"></div>`;
  const r=await api('/api/jobs');if(TAB!=='jobs'||!r.success)return;
  $('#jl').innerHTML=r.jobs.map(j=>`<div class="card"><b>${esc(j.title)}</b><div class="muted small">${esc(j.name)} · ${when(j.created)}</div><p>${esc(j.desc)}</p><div class="row sp"><span>📞 ${esc(j.contact)}</span>${j.mine||ADMIN?`<button class="r" data-a="jdel" data-id="${j.id}">🗑</button>`:''}</div></div>`).join('')||'<p class="muted" style="padding:0 14px">ሥራ የለም</p>'}
async function jpost(){const r=await api('/api/jobs/create',{title:val('jt'),desc:val('jd'),contact:val('jc')});r.success?vJobs():toast(r.error)}
async function jdel(d){await api(`/api/jobs/${d.id}/delete`,{});vJobs()}

/* ---------- ማኅበረሰብ ---------- */
async function vComm(){
  $('#app').innerHTML=head()+`<div class="card"><textarea id="po" rows="2" placeholder="ምን እያሰቡ ነው?" maxlength="500"></textarea><button data-a="ppost" style="width:100%">ለጥፍ</button></div><div id="pl"></div>`;
  const r=await api('/api/posts');if(TAB!=='comm'||!r.success)return;
  $('#pl').innerHTML=r.posts.map(p=>`<div class="card"><div class="row">${av(p.name,p.photo)}<div><b>${esc(p.name)}</b><div class="small muted">${when(p.created)}</div></div></div><p>${esc(p.text)}</p><div class="row"><button class="g" data-a="plike" data-id="${p.id}">${p.liked?'❤️':'🤍'} ${p.likes}</button>${p.mine||ADMIN?`<button class="r" data-a="pdel" data-id="${p.id}">🗑</button>`:''}</div></div>`).join('')||'<p class="muted" style="padding:0 14px">ልጥፍ የለም</p>'}
async function ppost(){const r=await api('/api/posts/create',{text:val('po')});r.success?vComm():toast(r.error)}
async function plike(d){await api(`/api/posts/${d.id}/like`,{});vComm()}
async function pdel(d){await api(`/api/posts/${d.id}/delete`,{});vComm()}

/* ---------- ሱፐር አድሚን ---------- */
async function vAdmin(){
  $('#app').innerHTML=head()+'<p class="muted" style="padding:0 14px">...</p>';
  const o=await api('/api/admin/overview');if(TAB!=='admin')return;if(!o.success)return toast(o.error);
  const s=o.stats,S=[['ተጠቃሚ',s.users],['ታግዶ',s.banned],['ክፍል',s.rooms],['ልጥፍ',s.posts],['ሥራ',s.jobs],['ሳንቲም',s.coins],['ገቢ',s.earnings],['ሽያጭ ብር',s.revenue],['የተከፈለ ብር',s.paid_out],['ኮሚሽን',s.fee_coins],['ስጦታ',s.gifts]];
  $('#app').innerHTML=head()+`<div class="card"><b>📊 ስታቲስቲክስ</b><div class="grid c4" style="margin-top:8px">${S.map(x=>`<div class="gift"><b>${x[1]}</b><br>${x[0]}</div>`).join('')}</div></div>
  <div class="card"><b>💳 የሳንቲም ግዢ ጥያቄዎች (${o.purchases.length})</b>${o.purchases.map(p=>`<div class="card" style="margin:8px 0"><b>${esc(p.name)}</b> · 🪙${p.coins} · ${p.price} ብር<div class="small muted">ID: ${esc(p.ref)} · ${esc(p.uid)} · ${when(p.created)}</div><div id="sh${p.id}"></div><div class="row" style="margin-top:6px"><button class="g" data-a="shot" data-id="${p.id}">🖼</button><button class="ok f1" data-a="apur" data-id="${p.id}" data-x="approve">✅ አጽድቅ</button><button class="r f1" data-a="apur" data-id="${p.id}" data-x="reject">❌</button></div></div>`).join('')||'<div class="muted small">የለም</div>'}</div>
  <div class="card"><b>💸 የማውጣት ጥያቄዎች (${o.withdrawals.length})</b>${o.withdrawals.map(w=>`<div class="card" style="margin:8px 0"><b>${esc(w.name)}</b> · ${w.amount} → <b>${w.birr} ብር</b><div class="small">📱 ${esc(w.phone)} · ${esc(w.acc_name)}</div><div class="row" style="margin-top:6px"><button class="ok f1" data-a="awd" data-id="${w.id}" data-x="paid">✅ ተከፍሏል</button><button class="r f1" data-a="awd" data-id="${w.id}" data-x="reject">❌ መልስ</button></div></div>`).join('')||'<div class="muted small">የለም</div>'}</div>
  <div class="card"><b>🎙️ ክፍሎች</b>${o.rooms.map(r=>`<div class="row sp" style="margin-top:6px"><span>${esc(r.name)} · 👥${r.count}</span><button class="r" data-a="arm" data-id="${esc(r.id)}">ዝጋ</button></div>`).join('')||'<div class="muted small">የለም</div>'}</div>
  <div class="card"><b>👤 ተጠቃሚዎች</b><div class="row"><input id="uq" placeholder="ስም ወይም tg_ID" class="f1"><button data-a="usr">ፈልግ</button></div><div id="ul"></div></div>
  <div class="card"><b>📜 የቅርብ ታሪክ</b>${o.history_p.concat(o.history_w).map(h=>`<div class="row sp small" style="margin-top:5px"><span>${esc(h.name)} · ${h.coins?'🪙'+h.coins:h.birr+' ብር'}</span>${st(h.status)}</div>`).join('')}</div>`;
  usr()}
async function usr(){const r=await api('/api/admin/users?q='+encodeURIComponent(val('uq')));if(!r.success)return;
  $('#ul').innerHTML=r.users.map(u=>`<div class="card" style="margin:8px 0"><b>${esc(u.username)}</b> ${u.banned?'🚫':''}<div class="small muted">${esc(u.uid)} · 🪙${u.coins} · 💵${u.earnings}</div><div class="row" style="flex-wrap:wrap;margin-top:6px"><button class="${u.banned?'ok':'r'}" data-a="uact" data-u="${esc(u.uid)}" data-x="${u.banned?'unban':'ban'}">${u.banned?'ፍቀድ':'አግድ'}</button><button class="g" data-a="grant" data-u="${esc(u.uid)}">🪙 ±</button><button class="r" data-a="uact" data-u="${esc(u.uid)}" data-x="delete">🗑 ሰርዝ</button></div></div>`).join('')}
async function shot(d){const r=await api('/api/admin/shot/'+d.id,undefined,true);
  if(r.blob){$('#sh'+d.id).innerHTML=`<img class="shot" src="${URL.createObjectURL(await r.blob())}">`}else toast(r.error||'ፎቶ የለም')}
async function apur(d){if(d.x==='approve'&&!confirm('ሳንቲሙ ይሰጠው?'))return;const r=await api('/api/admin/purchase',{id:d.id,action:d.x});r.success?vAdmin():toast(r.error)}
async function awd(d){const r=await api('/api/admin/withdraw',{id:d.id,action:d.x});r.success?vAdmin():toast(r.error)}
async function arm(d){if(!confirm('ክፍሉ ይዘጋ?'))return;await api('/api/admin/room',{id:d.id});vAdmin()}
async function uact(d){if(d.x==='delete'&&!confirm('ተጠቃሚው ሙሉ በሙሉ ይሰረዝ?'))return;const r=await api('/api/admin/user',{uid:d.u,action:d.x});r.success?usr():toast(r.error)}
async function grant(d){const a=prompt('የሳንቲም መጠን (ለመቀነስ -)');if(!a)return;const r=await api('/api/admin/user',{uid:d.u,action:'grant',amount:a});r.success?(toast('✅'),usr()):toast(r.error)}

/* ---------- ጠቅታዎች ---------- */
const A={go:d=>go(d.t),mk,enter:d=>enter(d.id),min:minimize,exit:exitRoom,seat:d=>seat(d.i),say,down,
  mute:()=>{if(!R)return;R.muted=!R.muted;R.mic=null;syncMic();R.open?drawRoom():renderMini()},
  gift,pkg,buy,wd,psave,jpost,jdel,ppost,plike,pdel,shot,apur,awd,arm,usr,uact,grant,close:()=>modal(),
  copy:d=>{navigator.clipboard&&navigator.clipboard.writeText('0970575151');toast('ተቀድቷል')}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ci')say()});
init();
</script></body></html>
