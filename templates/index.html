<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Twenty One Party</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;background:#0a0118;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh}
.logo{font-size:28px;font-weight:800;background:linear-gradient(90deg,#ffd700,#ff9f1c,#9b5cff);-webkit-background-clip:text;color:transparent;margin-bottom:20px}
.spinner{width:40px;height:40px;border:4px solid #333;border-top-color:#ffd700;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.msg{margin-top:16px;color:#a99bc4;font-size:14px}
.error{color:#ff5c7a}
.success{color:#2ee59d}
</style>
</head>
<body>
<div class="logo">🎙 Twenty One Party</div>
<div class="spinner"></div>
<div class="msg" id="status">Loading...</div>

<script>
const statusEl = document.getElementById('status');

function setStatus(msg, isError=false) {
  statusEl.textContent = msg;
  statusEl.className = 'msg' + (isError ? ' error' : '');
}

async function test() {
  try {
    setStatus('Testing connection...');
    
    // Test 1: Check if Telegram SDK loaded
    const tg = window.Telegram && Telegram.WebApp;
    setStatus('Telegram SDK: ' + (tg ? '✅' : '❌'));
    await new Promise(r => setTimeout(r, 1000));
    
    // Test 2: Try API call
    setStatus('Testing API...');
    const r = await fetch('/healthz');
    const text = await r.text();
    setStatus('API /healthz: ' + (text === 'ok' ? '✅' : '❌ ' + text));
    await new Promise(r => setTimeout(r, 1000));
    
    // Test 3: Try register
    setStatus('Testing /api/register...');
    const initData = tg ? tg.initData : '';
    const r2 = await fetch('/api/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({init: initData, dev_id: '1'})
    });
    const d = await r2.json();
    
    if (!r2.ok) {
      setStatus('Register failed: ' + (d.error || r2.status), true);
      return;
    }
    
    setStatus('✅ Success! Token: ' + d.token.substring(0, 20) + '...');
    await new Promise(r => setTimeout(r, 2000));
    
    // Show user data
    document.body.innerHTML = `
      <div class="logo">🎙 Twenty One Party</div>
      <div class="success" style="font-size:18px;margin:20px 0">✅ Connected!</div>
      <div style="background:#1a0a2e;padding:16px;border-radius:12px;max-width:90%">
        <div><b>User:</b> ${d.me.name}</div>
        <div><b>Coins:</b> ${d.me.coins}</div>
        <div><b>Level:</b> ${d.me.lvn}</div>
        <div><b>Host:</b> ${d.me.host}</div>
        <div><b>Agent:</b> ${d.me.ag ? 'Yes' : 'No'}</div>
      </div>
      <div style="margin-top:20px;color:#a99bc4;font-size:12px">
        Channel: ${d.cfg.channel}<br>
        Support: ${d.cfg.support}
      </div>
    `;
    
  } catch (e) {
    setStatus('❌ Error: ' + e.message, true);
    console.error(e);
  }
}

test();
</script>
</body>
</html>
