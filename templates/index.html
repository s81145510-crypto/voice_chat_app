<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0118">
<title>Twenty One Party</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>
<style>
:root{--bg:#0a0118;--bg2:#1a0a2e;--card:rgba(255,255,255,.065);--line:rgba(255,255,255,.1);--gold:#ffd700;--pri:#667eea;--pri2:#9b5cff;--ok:#2ee59d;--bad:#ff5c7a;--mut:#a99bc4;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(160deg,var(--bg),var(--bg2)) fixed;color:#fff;font:15px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans Ethiopic',sans-serif;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0}
.page{position:fixed;inset:0;padding:calc(var(--st) + 12px) 14px calc(76px + var(--sb));overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.page.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{margin:6px 0 12px;font-size:20px}h3{margin:14px 0 8px;font-size:15px;color:var(--mut);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;backdrop-filter:blur(8px)}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}.col{display:flex;flex-direction:column;gap:8px}
.mut{color:var(--mut);font-size:12px}.gold{color:var(--gold)}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{padding:11px 16px;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri2));font-weight:600;transition:.15s}
.btn:active{transform:scale(.96)}.btn.gold{background:linear-gradient(135deg,#ffd700,#ff9f1c);color:#2a1a00}.btn.ghost{background:var(--card);border:1px solid var(--line)}
.btn.bad{background:linear-gradient(135deg,#ff5c7a,#d6336c)}.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}.btn[disabled]{opacity:.5}
.chip{padding:7px 13px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip.on{background:linear-gradient(135deg,var(--pri),var(--pri2));border-color:transparent}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.chips::-webkit-scrollbar{display:none}
input,textarea,select{width:100%;padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid var(--line);outline:0}
input:focus,textarea:focus{border-color:var(--pri2)}select option{color:#000}
.av{width:44px;height:44px;border-radius:50%;background:#444 center/cover;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;position:relative}
.av.s{width:34px;height:34px;font-size:13px}.av.l{width:72px;height:72px;font-size:28px}
.pill{display:inline-flex;gap:5px;align-items:center;padding:5px 11px;border-radius:20px;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.35);color:var(--gold);font-weight:700;font-size:13px}
.badge{font-size:11px;padding:2px 7px;border-radius:8px;background:rgba(155,92,255,.25)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.logo{font-weight:800;font-size:18px;background:linear-gradient(90deg,#ffd700,#ff9f1c,#9b5cff);-webkit-background-clip:text;color:transparent}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;padding:6px 6px calc(6px + var(--sb));background:rgba(10,1,24,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:20}
nav button{flex:1;background:none;color:var(--mut);font-size:10px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:21px;filter:grayscale(.7)}nav button.on{color:#fff}nav button.on i{filter:none;transform:translateY(-2px)}
.mini{position:fixed;left:10px;right:10px;bottom:calc(66px + var(--sb));z-index:19;display:none;align-items:center;gap:10px;padding:9px 12px;border-radius:16px;background:linear-gradient(135deg,#3b2a8f,#7a3fd1);box-shadow:0 6px 24px #0008}
.mini.on{display:flex}
.hero{background:linear-gradient(135deg,rgba(102,126,234,.35),rgba(155,92,255,.25));border-radius:18px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.room-card{display:flex;gap:12px;align-items:center}.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:5px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.game{text-align:center;padding:18px 8px;border-radius:16px;background:var(--card);border:1px solid var(--line)}.game b{display:block;font-size:34px}.game span{font-size:12px;color:var(--gold)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:480px;max-height:88vh;overflow-y:auto;background:linear-gradient(180deg,#1d0f38,#12072a);border-radius:22px 22px 0 0;padding:16px 16px calc(16px + var(--sb));border:1px solid var(--line)}
.sheet h3{color:#fff;font-size:17px;margin:0 0 12px}
.toast{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translateX(-50%);background:#000d;padding:10px 16px;border-radius:14px;z-index:99;max-width:90%;text-align:center;animation:fade .2s;border:1px solid var(--line)}
/* vip + avatar frames */
.vip{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.3px;padding:1px 5px;border-radius:6px;background:linear-gradient(135deg,#ffd700,#ff9f1c);color:#2a1a00;vertical-align:1px;white-space:nowrap}
.msg b.vipn,.seat .nm.vipn,.vipn{color:var(--gold)}
.vipc{border-color:rgba(255,215,0,.45);background:linear-gradient(135deg,rgba(255,215,0,.13),rgba(255,159,28,.06))}
.fr{--rw:3px}.av.l.fr{--rw:4px}.av.s.fr{--rw:2.5px}
.fr::before{content:'';position:absolute;inset:-4px;border-radius:50%;pointer-events:none;box-shadow:0 0 10px var(--gl,transparent)}
.fr::after{content:'';position:absolute;inset:-4px;border-radius:50%;pointer-events:none;background:var(--fr);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - var(--rw)),#000 calc(100% - var(--rw) + .6px));mask:radial-gradient(farthest-side,transparent calc(100% - var(--rw)),#000 calc(100% - var(--rw) + .6px))}
.fr-neon{--fr:linear-gradient(135deg,#c4a1ff,#667eea);--gl:#9b5cff99}
.fr-ice{--fr:conic-gradient(#e6fbff,#4cc9f0,#e6fbff,#4cc9f0,#e6fbff);--gl:#4cc9f066}
.fr-fire{--fr:conic-gradient(#ff3d00,#ffb300,#ff3d00,#ffb300,#ff3d00);--gl:#ff6a0088}
.fr-rose{--fr:conic-gradient(#ff5c7a,#ffd1dc,#ff5c7a,#d6336c,#ff5c7a);--gl:#ff5c7a66}
.fr-rainbow{--fr:conic-gradient(#ff3b3b,#ffb300,#f5ff3b,#2ee59d,#4cc9f0,#667eea,#c77dff,#ff3b3b);--gl:#c77dff66}
.fr-vgold{--fr:conic-gradient(#fff3b0,#ffd700,#b8860b,#ffd700,#fff3b0);--gl:#ffd70099}
.fr-vaurora{--fr:conic-gradient(#2ee59d,#667eea,#c77dff,#4cc9f0,#2ee59d);--gl:#2ee59d66}
.fr-fire::after,.fr-rainbow::after,.fr-vgold::after,.fr-vaurora::after{animation:frspin 3.2s linear infinite}
@keyframes frspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.fr::after{animation:none!important}}
.fg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fi{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px 9px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:12px;text-align:center}
.fi.on{border-color:var(--gold);background:rgba(255,215,0,.12)}.fi .fp{color:var(--gold);font-size:11px}
/* missions */
.ms{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.ms:last-of-type{border-bottom:0}
.ms .mut{white-space:nowrap}
/* live */
#live{position:fixed;inset:0;z-index:30;background:#000;display:none}#live.on{display:block}
#lv-video{position:absolute;inset:0;background:radial-gradient(#2a0f4a,#000)}#lv-video video{object-fit:cover!important}
.lv-top{position:absolute;top:calc(var(--st) + 10px);left:10px;right:10px;display:flex;align-items:center;gap:8px;z-index:2}
.lv-bot{position:absolute;left:0;right:0;bottom:0;padding:30px 10px calc(10px + var(--sb));background:linear-gradient(transparent,#000c);z-index:2}
#lv-chat{max-height:34vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px;margin-bottom:8px;width:82%}#lv-chat .msg{background:#0006}
.lv-tag{background:#ff2d55;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:800;letter-spacing:.5px}
/* room */
#room{position:fixed;inset:0;z-index:30;background:linear-gradient(160deg,#0a0118,#1b0b33 60%,#2a0f4a);display:none;flex-direction:column;padding-top:var(--st)}
#room.on{display:flex}
.rh{display:flex;align-items:center;gap:10px;padding:10px 12px}.rh .t{flex:1;min-width:0}.rh button{background:var(--card);border-radius:12px;width:38px;height:38px;font-size:17px;color:#fff}
.seats{padding:4px 10px 6px}.hostrow{display:flex;justify-content:center;margin-bottom:8px}
.sg{display:grid;grid-template-columns:repeat(5,1fr);gap:7px 4px}
.seat{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;position:relative}
.seat .av{width:50px;height:50px;border:2px solid transparent;transition:.15s}.seat.host .av{width:66px;height:66px;border-color:var(--gold);box-shadow:0 0 18px #ffd70066}
.seat.empty .av{background:rgba(255,255,255,.06);border:1.5px dashed rgba(255,255,255,.25);color:var(--mut);font-size:12px}
.seat.speak .av{border-color:var(--ok);box-shadow:0 0 0 4px #2ee59d44,0 0 18px #2ee59d99;animation:sp .7s infinite alternate}
@keyframes sp{to{box-shadow:0 0 0 7px #2ee59d22,0 0 24px #2ee59d}}
.seat .nm{font-size:10.5px;max-width:100%;color:#ddd}.seat .mt{position:absolute;top:34px;right:calc(50% - 31px);font-size:12px;background:#000a;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center}
.seat.host .mt{top:48px;right:calc(50% - 40px)}
.chat{flex:1;overflow-y:auto;padding:6px 12px;display:flex;flex-direction:column;gap:5px;mask-image:linear-gradient(transparent,#000 14px)}
.msg{background:rgba(255,255,255,.07);padding:6px 10px;border-radius:12px;align-self:flex-start;max-width:88%;word-break:break-word;font-size:13.5px}
.msg b{color:#c9b6ff}.msg.gift{background:linear-gradient(135deg,rgba(255,215,0,.2),rgba(255,92,122,.2));border:1px solid rgba(255,215,0,.3)}
.bar{display:flex;gap:8px;align-items:center;padding:8px 10px calc(8px + var(--sb));border-top:1px solid var(--line);background:rgba(0,0,0,.25)}
.bar input{border-radius:22px}.rb{width:44px;height:44px;border-radius:50%;background:var(--card);font-size:20px;flex:none;border:1px solid var(--line)}
.rb.mic{background:linear-gradient(135deg,var(--ok),#10b981);display:none}.rb.mic.on{display:block}.rb.mic.off{background:linear-gradient(135deg,#ff5c7a,#d6336c)}
.vs{font-size:11px;padding:3px 9px;border-radius:10px;background:#0006}
.fly{position:fixed;left:50%;top:42%;z-index:90;font-size:90px;pointer-events:none;animation:fly 2.6s ease-out forwards;text-align:center;filter:drop-shadow(0 0 24px gold)}
.fly small{display:block;font-size:14px;color:#fff;background:#000a;border-radius:12px;padding:3px 10px;margin-top:4px}
@keyframes fly{0%{transform:translate(-50%,60px) scale(.3);opacity:0}20%{transform:translate(-50%,0) scale(1.15);opacity:1}75%{transform:translate(-50%,-20px) scale(1);opacity:1}100%{transform:translate(-50%,-120px) scale(.9);opacity:0}}
.fly.big{font-size:150px;animation-duration:3.8s}
.gg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.gi{text-align:center;padding:9px 2px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:11px}.gi b{display:block;font-size:28px}.gi.on{border-color:var(--gold);background:rgba(255,215,0,.12)}
.tier-rare{box-shadow:inset 0 0 0 1px #4cc9f0}.tier-epic{box-shadow:inset 0 0 0 1px #c77dff}.tier-luxury{box-shadow:inset 0 0 0 1px #ffd700}.tier-legendary{box-shadow:inset 0 0 0 1px #ff5c7a}.tier-mythic{box-shadow:inset 0 0 0 1px #2ee59d,0 0 10px #2ee59d55}
.bar2{height:8px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--gold))}
.res{text-align:center;font-size:44px;min-height:64px;margin:8px 0}.win{color:var(--ok)}.lose{color:var(--bad)}
.splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:100;background:linear-gradient(160deg,var(--bg),var(--bg2))}
.spin{width:36px;height:36px;border:4px solid #fff3;border-top-color:var(--gold);border-radius:50%;animation:rot 1s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--mut);padding:26px 0}
</style>
</head>
<body>
<div class="splash" id="splash"><div class="logo" style="font-size:28px">🎙 Twenty One Party</div><div class="spin"></div><div class="mut" id="splash-t">በመጫን ላይ…</div></div>

<div class="page" id="p-home"></div><div class="page" id="p-rooms"></div><div class="page" id="p-games"></div>
<div class="page" id="p-wallet"></div><div class="page" id="p-community"></div><div class="page" id="p-me"></div>

<div class="mini" id="mini" onclick="showRoom()"><span style="font-size:22px">🎙</span><div class="sp"><div class="ell" id="mini-n" style="font-weight:600"></div><div class="mut" style="color:#ddd">ለመመለስ ንካ · <span id="mini-o">0</span> online</div></div><button class="btn sm bad" onclick="event.stopPropagation();exitRoom()">ውጣ</button></div>

<nav id="nav">
<button data-p="home" class="on"><i>🏠</i>ቤት</button><button data-p="rooms"><i>🎧</i>ክፍሎች</button><button data-p="games"><i>🎮</i>ጨዋታ</button>
<button data-p="wallet"><i>👛</i>ቦርሳ</button><button data-p="community"><i>💬</i>ማህበረሰብ</button><button data-p="me"><i>👤</i>እኔ</button>
</nav>

<div id="room">
  <div class="rh"><button onclick="minimize()">⌄</button><div class="t"><div class="ell" id="r-name" style="font-weight:700"></div><div class="mut"><span class="live"></span><span id="r-on">0</span> online · <span class="vs" id="r-vs">🔇 አልተገናኘም</span></div></div><button onclick="exitRoom()">✕</button></div>
  <div class="seats"><div class="hostrow" id="r-host"></div><div class="sg" id="r-seats"></div></div>
  <div class="chat" id="r-chat"></div>
  <div class="bar"><button class="rb mic" id="r-mic" onclick="toggleMic()">🎤</button><input id="r-in" placeholder="መልእክት…" maxlength="200" onkeydown="if(event.key==='Enter')sendChat()"><button class="rb" onclick="openGift()">🎁</button><button class="rb" style="background:linear-gradient(135deg,var(--pri),var(--pri2))" onclick="sendChat()">➤</button></div>
</div>

<div id="live"><div id="lv-video"></div>
  <div class="lv-top"><div class="row sp" id="lv-host" style="background:#0007;border-radius:24px;padding:4px 12px 4px 4px;flex:0 1 auto"></div><span class="lv-tag">LIVE</span><span class="vs">👁 <span id="lv-on">0</span></span><span class="vs" id="lv-vs">⏳</span><span class="sp"></span><button class="rb" style="width:36px;height:36px;font-size:15px" onclick="exitRoom()">✕</button></div>
  <div class="lv-bot"><div id="lv-chat"></div><div class="row"><input id="lv-in" placeholder="መልእክት…" maxlength="200" style="background:#0007" onkeydown="if(event.key==='Enter')sendChat()"><button class="rb" id="lv-flip" style="display:none" onclick="flipCam()">🔄</button><button class="rb" id="lv-mic" style="display:none" onclick="liveMic()">🎤</button><button class="rb" onclick="openGift()">🎁</button><button class="rb" style="background:linear-gradient(135deg,var(--pri),var(--pri2))" onclick="sendChat()">➤</button></div></div>
</div>

<script>
/* ============================== core ============================== */
const tg=window.Telegram&&Telegram.WebApp;
try{tg&&(tg.ready(),tg.expand(),tg.setHeaderColor&&tg.setHeaderColor('#0a0118'),tg.setBackgroundColor&&tg.setBackgroundColor('#0a0118'),tg.disableVerticalSwipes&&tg.disableVerticalSwipes())}catch(e){}
let TOKEN=localStorage.getItem('tk')||'',S={me:null,cfg:null},R=null,PAGE='home';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en-US');
const ago=t=>{const d=Math.floor(Date.now()/1000-t);return d<60?'አሁን':d<3600?Math.floor(d/60)+' ደ':d<86400?Math.floor(d/3600)+' ሰ':Math.floor(d/86400)+' ቀ'};
function toast(m,t=2400){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),t)}
function hap(t='light'){try{tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred(t)}catch(e){}}
function av(u,cls=''){const n=(u&&u.name||'?')[0].toUpperCase();const h=((u&&u.id)||0)*47%360;const f=u&&u.fr?` fr fr-${esc(u.fr)}`:'';
 return u&&u.photo?`<div class="av ${cls}${f}" style="background-image:url('${esc(u.photo)}')"></div>`:`<div class="av ${cls}${f}" style="background:hsl(${h},55%,42%)">${esc(n)}</div>`}
const vipTag=u=>u&&u.vip?'<span class="vip">VIP</span>':'';
const vipLeft=m=>Math.max(0,Math.ceil(((m.vip_until||0)-Date.now()/1000)/86400));
async function api(path,body,retry=true){
  const o={headers:{}};if(TOKEN)o.headers.Authorization='Bearer '+TOKEN;
  if(body!==undefined){o.method='POST';if(body instanceof FormData)o.body=body;else{o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}}
  let r;try{r=await fetch(path,o)}catch(e){throw new Error('ኢንተርኔት የለም')}
  if(r.status===401&&retry){await login();return api(path,body,false)}
  const d=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(d.error||'ስህተት');e.code=r.status;throw e}
  return d}
async function login(){
  const q=new URLSearchParams(location.search);
  const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init:(tg&&tg.initData)||'',dev_id:q.get('dev')})});
  const d=await r.json();if(!r.ok)throw new Error(d.error||'login failed');
  TOKEN=d.token;localStorage.setItem('tk',TOKEN);S.me=d.me;S.cfg=d.cfg}
function setMe(m){S.me=m;$$('.coins-n').forEach(e=>e.textContent=fmt(m.coins))}
function modal(html,onclose){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="sheet">${html}</div>`;
  o.onclick=e=>{if(e.target===o)close()};const close=()=>{o.remove();onclose&&onclose()};o.close=close;document.body.appendChild(o);return o}
const closeModal=()=>{const m=$$('.ov').pop();m&&m.close()};
async function run(btn,fn){if(btn)btn.disabled=true;try{return await fn()}catch(e){toast(e.message)}finally{if(btn)btn.disabled=false}}
function shrink(file,max=1100,q=.8){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error('image')),'image/jpeg',q)};i.onerror=()=>rej(new Error('ምስል አይደለም'));i.src=URL.createObjectURL(file)})}
const topbar=()=>`<div class="top"><div class="logo">🎙 Twenty One</div><span class="pill" onclick="go('wallet')">🪙 <span class="coins-n">${fmt(S.me.coins)}</span></span></div>`;

/* ============================== navigation ============================== */
const LOAD={home:renderHome,rooms:renderRooms,games:renderGames,wallet:renderWallet,community:renderCommunity,me:renderMe};
function go(p){PAGE=p;$$('.page').forEach(e=>e.classList.toggle('on',e.id==='p-'+p));$$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));hideRoom();LOAD[p]();hap()}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.p)};
setInterval(()=>{if(!document.hidden&&!R?.visible&&PAGE==='rooms')loadRoomList()},8000);

/* ============================== home ============================== */
async function renderHome(){
  const m=S.me,el=$('#p-home');
  el.innerHTML=topbar()+`<div class="hero"><div class="row">${av(m,'l')}<div class="sp"><div style="font-size:18px;font-weight:700" class="ell">ሰላም ${esc(m.name)} 👋</div><div class="mut">${m.lvi} ${m.lvn} ${vipTag(m)} · 🪙 <span class="coins-n">${fmt(m.coins)}</span></div></div></div>
  <div class="row" style="margin-top:12px"><button class="btn gold sp" id="daily" ${m.daily_ready?'':'disabled'}>🎁 ${m.daily_ready?'የዕለት ሽልማት ውሰድ'+(m.vip?' (VIP +50%)':''):'ዛሬ ወስደሃል ✓'}</button><button class="btn sp" onclick="go('rooms')">🎧 ክፍል ግባ</button></div></div>
  <div id="h-ms"></div><h3>🔥 ሞቅ ያሉ ክፍሎች</h3><div id="h-rooms" class="empty">…</div><h3>🏆 ከፍተኛ ስጦታ ሰጪዎች</h3><div id="h-lb" class="empty">…</div>`;
  $('#daily').onclick=e=>run(e.target,async()=>{const d=await api('/api/daily',{});setMe(d.me);toast(`🎉 +${d.reward} ሳንቲም (ቀን ${d.streak})`);hap('medium');renderHome()});
  loadMsCard();
  api('/api/rooms').then(d=>{const r=d.rooms.slice(0,3);$('#h-rooms').className='';$('#h-rooms').innerHTML=r.length?r.map(roomCard).join(''):'<div class="empty">ክፍል የለም — የመጀመሪያውን ክፈት!</div>'}).catch(()=>{});
  api('/api/leaderboard').then(d=>{const l=d.senders.slice(0,5);$('#h-lb').className='';$('#h-lb').innerHTML=l.length?`<div class="card">${l.map((u,i)=>`<div class="row" style="padding:5px 0">${['🥇','🥈','🥉','4','5'][i]}${av(u,'s')}<div class="sp ell">${esc(u.name)} ${vipTag(u)} <span class="badge">${u.lvi}${u.lvn}</span></div><b class="gold">${fmt(u.v)}</b></div>`).join('')}</div>`:'<div class="empty">ገና ማንም አልሰጠም</div>'}).catch(()=>{})}

/* ============================== rooms ============================== */
let RT='voice';
function roomCard(r){const lv=r.kind==='live';return `<div class="card room-card" onclick="enterRoom('${r.id}')">${av(r.host,'')}<div class="sp"><div class="ell" style="font-weight:600">${lv?'<span class="lv-tag">LIVE</span> ':''}${esc(r.name)}</div><div class="mut ell">${esc(r.topic||('Host: '+(r.host?r.host.name:'-')))}</div></div><div style="text-align:right"><div><span class="live"></span><b>${r.online}</b></div><div class="mut">${lv?'📹 ላይቭ':'🎤 '+r.seated+'/21'}</div></div></div>`}
function renderRooms(){$('#p-rooms').innerHTML=topbar()+`<div class="chips" style="margin-bottom:10px"><div class="chip ${RT==='voice'?'on':''}" onclick="RT='voice';renderRooms()">🎧 ድምፅ</div><div class="chip ${RT==='live'?'on':''}" onclick="RT='live';renderRooms()">📹 ላይቭ</div></div><div class="row" style="margin-bottom:10px"><h2 class="sp" style="margin:0">${RT==='live'?'📹 ላይቭ ስትሪም':'🎧 የድምፅ ክፍሎች'}</h2><button class="btn sm ${RT==='live'?'bad':''}" onclick="newRoom(RT)">${RT==='live'?'📹 Go Live':'＋ ክፈት'}</button></div><div id="rl"><div class="empty">…</div></div>`;loadRoomList()}
async function loadRoomList(){try{const d=await api('/api/rooms');const l=d.rooms.filter(r=>(r.kind||'voice')===RT);const el=$('#rl');if(el)el.innerHTML=l.length?l.map(roomCard).join(''):`<div class="empty">${RT==='live'?'📹<br>ላይቭ የለም። መጀመሪያ ሁን!':'🎙<br>ክፍል የለም። የመጀመሪያውን ክፈት!'}</div>`}catch(e){}}
function newRoom(kind){const lv=kind==='live';const m=modal(`<h3>${lv?'📹 ላይቭ ጀምር':'🎙 አዲስ ክፍል'}</h3><div class="col"><input id="nr-n" placeholder="${lv?'የላይቭ ርዕስ':'የክፍል ስም'}" maxlength="40">${lv?'':'<input id="nr-t" placeholder="ርዕስ (አማራጭ)" maxlength="100">'}<button class="btn ${lv?'bad':''}" id="nr-b">${lv?'📹 ጀምር':'ክፈት'}</button></div>`);
  $('#nr-b').onclick=e=>run(e.target,async()=>{const d=await api('/api/rooms/create',{name:$('#nr-n').value,topic:lv?'':$('#nr-t').value,kind:lv?'live':'voice'});m.close();enterRoom(d.id)})}

/* ============================== voice engine (Agora live mode) ============================== */
const V={client:null,track:null,rid:null,pub:false,busy:false,preparing:false,
 set(t,c){const e=$(R&&R.kind==='live'?'#lv-vs':'#r-vs');if(e){e.textContent=t;e.style.color=c||''}},
 async join(rid,kind,isHost){
  await this.leave();this.rid=rid;this.set('⏳ በመገናኘት ላይ…');
  const d=await api('/api/agora-token',{room_id:rid});
  AgoraRTC.setLogLevel&&AgoraRTC.setLogLevel(3);
  AgoraRTC.onAutoplayFailed=()=>toast('🔊 ድምፅ ለማብራት ማያውን ንካ');
  const c=AgoraRTC.createClient({mode:'live',codec:'vp8'});this.client=c;
  await c.setClientRole(kind==='live'&&isHost?'host':'audience');
  c.on('user-published',async(u,m)=>{try{await c.subscribe(u,m);if(m==='audio')u.audioTrack.play();else if(m==='video'){try{c.setStreamFallbackOption&&c.setStreamFallbackOption(u,1)}catch(e){}u.videoTrack.play('lv-video',{fit:'cover'})}}catch(e){console.warn(e)}});
  c.on('volume-indicator',vs=>{const on=new Set(vs.filter(v=>v.level>6).map(v=>v.uid||S.me.id));$$('.seat[data-uid]').forEach(s=>s.classList.toggle('speak',on.has(+s.dataset.uid)))});
  c.on('token-privilege-will-expire',()=>this.renew());c.on('token-privilege-did-expire',()=>this.renew());
  c.on('connection-state-change',s=>{if(this.client!==c)return;this.set(s==='CONNECTED'?'🔊 ተገናኝቷል':s==='RECONNECTING'?'⚠️ እንደገና…':s==='DISCONNECTED'?'🔇 ተቋርጧል':'⏳ …',s==='CONNECTED'?'#2ee59d':'')});
  c.enableAudioVolumeIndicator();
  await c.join(d.app_id,d.channel,d.token,d.uid);
  if(this.client!==c){try{await c.leave()}catch(e){}return}if(kind==='live'&&isHost)await this.startHost()},
 async startHost(){try{const[a,v]=await AgoraRTC.createMicrophoneAndCameraTracks({AEC:true,ANS:true,AGC:true},{encoderConfig:'480p_2',facingMode:'user'});this.track=a;this.vtrack=v;v.play('lv-video',{mirror:true,fit:'cover'});
   try{await this.client.enableDualStream()}catch(e){}await this.client.publish([a,v]);this.pub=true;$('#lv-flip').style.display='';$('#lv-mic').style.display=''}
  catch(e){toast('📷 ካሜራ/ማይክ አልተፈቀደም — በስልክ ቅንብር ፍቀድ');exitRoom(true)}},
 async renew(){try{const d=await api('/api/agora-token',{room_id:this.rid});await this.client.renewToken(d.token)}catch(e){}},
 async prepMic(){ // ask permission BEFORE taking a seat
  if(this.track)return true;
  try{this.track=await AgoraRTC.createMicrophoneAudioTrack({AEC:true,ANS:true,AGC:true,encoderConfig:'music_standard'});return true}
  catch(e){toast('🎤 ማይክሮፎን አልተፈቀደም — በስልክ ቅንብር ፍቀድ');return false}},
 async sync(seated,muted){
  const c=this.client;if(!c||this.busy||c.connectionState!=='CONNECTED')return;this.busy=true;
  try{
   if(seated&&!this.pub){
     if(!await this.prepMic()){await api(`/api/rooms/${this.rid}/leave-seat`,{});return}
     const d=await api('/api/agora-token',{room_id:this.rid});
     await c.setClientRole('host');if(d.token)await c.renewToken(d.token);
     await c.publish(this.track);this.pub=true}
   if(!seated&&this.pub){try{await c.unpublish(this.track)}catch(e){}this.track.close();this.track=null;await c.setClientRole('audience');this.pub=false}
   if(this.pub&&this.track)await this.track.setEnabled(!(muted||R?.selfMute));
   updateMicBtn(seated,muted)
  }catch(e){console.warn('sync',e);this.pub=false}finally{this.busy=false}},
 async leave(){const c=this.client;this.client=null;this.pub=false;this.rid=null;
  if(this.track){try{this.track.close()}catch(e){}this.track=null}if(this.vtrack){try{this.vtrack.close()}catch(e){}this.vtrack=null}
  if(c){try{await c.leave()}catch(e){}}}};

/* ============================== room ============================== */
async function enterRoom(rid){
  if(R&&R.id===rid){showRoom();return}
  if(R)await exitRoom(true);
  try{const d=await api(`/api/rooms/${rid}/join`,{});
   R={kind:d.room.kind||'voice',id:rid,name:d.room.name,host:d.room.host_id,v:-1,mid:0,seats:{},online:0,init:true,alive:true,selfMute:false,visible:true,t:null,n:0};
   $('#r-name').textContent=d.room.name;$('#r-chat').innerHTML='';$('#lv-chat').innerHTML='';$('#lv-host').innerHTML='';$('#lv-mic').style.display='none';$('#lv-flip').style.display='none';$('#r-seats').innerHTML='';$('#r-host').innerHTML='';
   showRoom();V.join(rid,R.kind,R.host===S.me.id).catch(e=>{V.set('❌ ድምፅ አልተገናኘም','#ff5c7a');toast('ድምፅ: '+e.message)});poll()
  }catch(e){toast(e.message==='ROOM_GONE'?'ክፍሉ ተዘግቷል':e.message)}}
function showRoom(){if(!R)return;R.visible=true;$(R.kind==='live'?'#live':'#room').classList.add('on');$('#mini').classList.remove('on');$('#nav').style.display='none'}
function hideRoom(){if(R&&R.kind==='live')return;$('#room').classList.remove('on');$('#nav').style.display='';if(R){R.visible=false;$('#mini').classList.add('on');$('#mini-n').textContent=R.name;$('#mini-o').textContent=R.online}else $('#mini').classList.remove('on')}
function minimize(){go(PAGE==='home'?'rooms':PAGE)}
async function exitRoom(silent){const r=R;if(!r)return;if(!silent&&r.kind==='live'&&r.host===S.me.id&&!confirm('ላይቭ ይጠናቀቅ?'))return;r.alive=false;clearTimeout(r.t);R=null;$('#live').classList.remove('on');
  $('#room').classList.remove('on');$('#mini').classList.remove('on');$('#nav').style.display='';
  await V.leave();api(`/api/rooms/${r.id}/exit`,{}).catch(()=>{});if(!silent&&PAGE==='rooms')loadRoomList()}
async function poll(){
  const r=R;if(!r||!r.alive)return;
  try{const d=await api(`/api/rooms/${r.id}/state?v=${r.v}&mid=${r.mid}`);if(R!==r)return;
   r.online=d.online;$('#r-on').textContent=d.online;$('#mini-o').textContent=d.online;$('#lv-on').textContent=d.online;
   if(d.seats){r.v=d.v;r.seats={};d.seats.forEach(s=>r.seats[s.i]=s);r.kind==='live'?renderLiveHost():renderSeats()}
   (d.msgs||[]).forEach(m=>{r.mid=Math.max(r.mid,m.id);addMsg(m,!r.init)});r.init=false;
   if(r.kind==='voice'){const mine=Object.values(r.seats).find(s=>s.u.id===S.me.id);V.sync(!!mine,mine&&mine.m);updateMicBtn(!!mine,mine&&mine.m)}r.n=0
  }catch(e){if(R!==r)return;if(e.message==='ROOM_GONE'){toast('ክፍሉ ተዘግቷል');exitRoom(true);return}if(e.code===403){exitRoom(true);return}r.n++}
  if(R===r)r.t=setTimeout(poll,document.hidden?6000:r.n>2?5000:2200)}
function seatHTML(i,s,host){
  if(!s)return `<div class="seat empty" onclick="seatTap(${i})"><div class="av">${i}</div><div class="nm">ባዶ</div></div>`;
  return `<div class="seat ${host?'host':''}" data-uid="${s.u.id}" onclick="seatTap(${i})">${av(s.u)}${s.m?'<span class="mt">🔇</span>':''}<div class="nm ell${s.u.vip?' vipn':''}">${esc(s.u.name)}</div></div>`}
function renderSeats(){const r=R;if(!r)return;
  const hs=r.seats[0];$('#r-host').innerHTML=hs?seatHTML(0,hs,true):`<div class="seat host empty" onclick="seatTap(0)"><div class="av">👑</div><div class="nm">host</div></div>`;
  let h='';for(let i=1;i<S.cfg.seats;i++)h+=seatHTML(i,r.seats[i]);$('#r-seats').innerHTML=h}
function updateMicBtn(seated,muted){const b=$('#r-mic');if(!b)return;b.classList.toggle('on',!!seated);const off=muted||R?.selfMute;b.classList.toggle('off',!!off);b.textContent=off?'🔇':'🎤'}
function toggleMic(){if(!R)return;R.selfMute=!R.selfMute;const mine=Object.values(R.seats).find(s=>s.u.id===S.me.id);V.sync(!!mine,mine&&mine.m);updateMicBtn(!!mine,mine&&mine.m);hap()}
async function seatTap(i){const r=R;if(!r)return;const s=r.seats[i];
  if(!s){ if(i===0&&r.host!==S.me.id)return toast('ይህ የhost ወንበር ነው'); if(i!==0&&r.host===S.me.id)return toast('host በራሱ ወንበር ላይ ነው');
    if(!await V.prepMic())return;
    try{await api(`/api/rooms/${r.id}/seat`,{idx:i});hap('medium');poll()}catch(e){toast(e.message);if(!V.pub&&V.track){V.track.close();V.track=null}} return}
  const u=s.u,mine=u.id===S.me.id,amHost=r.host===S.me.id||S.me.is_admin;
  modal(`<div class="col" style="align-items:center;text-align:center">${av(u,'l')}<b style="font-size:18px">${esc(u.name)}</b><div><span class="badge">${u.lvi} ${u.lvn}</span> ${vipTag(u)}</div><div class="mut">${esc(u.bio||'')}</div></div>
  <div class="row" style="margin-top:14px;flex-wrap:wrap;justify-content:center">
  ${mine?(i===0?'':`<button class="btn bad sm" onclick="seatLeave()">ወንበር ልቀቅ</button>`):`<button class="btn gold sm" onclick="closeModal();openGift(${u.id})">🎁 ስጦታ</button>`}
  ${amHost&&!mine&&u.id!==r.host?`<button class="btn ghost sm" onclick="seatAct(${u.id},'${s.m?'unmute':'mute'}')">${s.m?'🔊 ድምፅ ፍቀድ':'🔇 አጥፋ'}</button><button class="btn bad sm" onclick="seatAct(${u.id},'kick')">⛔ አስወጣ</button>`:''}</div>`)}
async function seatLeave(){closeModal();await run(null,async()=>{await api(`/api/rooms/${R.id}/leave-seat`,{});poll()})}
async function seatAct(uid,a){closeModal();await run(null,async()=>{await api(`/api/rooms/${R.id}/seat-action`,{uid,action:a});poll()})}
async function sendChat(){const i=$(R&&R.kind==='live'?'#lv-in':'#r-in'),t=i.value.trim();if(!t||!R)return;i.value='';try{await api(`/api/rooms/${R.id}/chat`,{text:t});poll()}catch(e){toast(e.message)}}
function addMsg(m,anim){const c=$(R&&R.kind==='live'?'#lv-chat':'#r-chat'),near=c.scrollHeight-c.scrollTop-c.clientHeight<90,d=document.createElement('div');
  if(m.k==='gift'){const g=m.meta||{};d.className='msg gift';d.innerHTML=`<b>${esc(m.n)}</b> → <b>${esc(g.to_name)}</b> ${g.emoji} ×${g.qty}`;if(anim)flyGift(g,m.n)}
  else{d.className='msg';d.innerHTML=`${m.v?'<span class="vip">VIP</span> ':''}<b class="${m.v?'vipn':''}">${esc(m.n)}:</b> ${esc(m.t)}`}
  c.appendChild(d);while(c.children.length>120)c.firstChild.remove();if(near||!anim)c.scrollTop=c.scrollHeight}
function flyGift(g,from){const e=document.createElement('div');e.className='fly'+(['luxury','legendary','mythic'].includes(g.tier)?' big':'');e.innerHTML=`${g.emoji}<small>${esc(from)} → ${esc(g.to_name)} ×${g.qty}</small>`;document.body.appendChild(e);setTimeout(()=>e.remove(),4000);hap('medium')}

/* ---- live helpers ---- */
function renderLiveHost(){const h=R&&R.seats[0];$('#lv-host').innerHTML=h?`${av(h.u,'s')}<div style="line-height:1.2"><b class="ell" style="display:block;max-width:110px">${esc(h.u.name)}</b><span class="mut ell" style="color:#ddd;display:block;max-width:110px">${esc(R.name)}</span></div>`:'…'}
async function flipCam(){try{const c=await AgoraRTC.getCameras();if(c.length<2||!V.vtrack)return;V.camI=((V.camI||0)+1)%c.length;await V.vtrack.setDevice(c[V.camI].deviceId)}catch(e){toast('ካሜራ መቀየር አልተቻለም')}}
async function liveMic(){if(!V.track||!R)return;R.selfMute=!R.selfMute;await V.track.setEnabled(!R.selfMute);$('#lv-mic').textContent=R.selfMute?'🔇':'🎤'}
/* ---- gifts ---- */
let GF={to:0,gift:null,qty:1};
function openGift(to){if(!R)return;const r=R;
  const rec=Object.values(r.seats).filter(s=>s.u.id!==S.me.id);if(!rec.length)return toast('ስጦታ የሚቀበል ሰው የለም (ወንበር ላይ ያለ ሰው ይፈልጋል)');
  GF={to:to||rec[0].u.id,gift:S.cfg.gifts[0].key,qty:1};
  const m=modal('');const draw=()=>{const g=S.cfg.gifts.find(x=>x.key===GF.gift);
   m.firstChild.innerHTML=`<div class="row"><h3 class="sp" style="margin:0">🎁 ስጦታ</h3><span class="pill">🪙 <span class="coins-n">${fmt(S.me.coins)}</span></span></div>
   <div class="chips" style="margin:10px 0">${rec.map(s=>`<div class="chip ${GF.to===s.u.id?'on':''}" onclick="GF.to=${s.u.id};this.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));this.classList.add('on')">${esc(s.u.name.slice(0,12))}</div>`).join('')}</div>
   <div class="gg">${S.cfg.gifts.map(x=>`<div class="gi tier-${x.tier} ${GF.gift===x.key?'on':''}" data-k="${x.key}"><b>${x.emoji}</b>${x.name}<div class="gold">🪙${fmt(x.price)}</div></div>`).join('')}</div>
   <div class="row" style="margin-top:12px"><div class="chips sp">${[1,5,10,20,50].map(q=>`<div class="chip ${GF.qty===q?'on':''}" data-q="${q}">×${q}</div>`).join('')}</div><button class="btn gold" id="g-send">ላክ · ${fmt(g.price*GF.qty)}</button></div>`;
   $$('.gi',m).forEach(e=>e.onclick=()=>{GF.gift=e.dataset.k;draw()});$$('[data-q]',m).forEach(e=>e.onclick=()=>{GF.qty=+e.dataset.q;draw()});
   $('#g-send',m).onclick=e=>run(e.target,async()=>{const d=await api(`/api/rooms/${r.id}/gift`,{to:GF.to,gift:GF.gift,qty:GF.qty});S.me.coins=d.coins;setMe(S.me);toast('✅ ተልኳል');hap('medium');poll()})};draw()}

/* ============================== games ============================== */

function openGame(k){const g=GM[k];let bet=50,pick=g.pick?g.pick[0]:0;
  const m=modal(`<div class="row"><h3 class="sp" style="margin:0">${g.i} ${g.n}</h3><span class="pill">🪙 <span class="coins-n">${fmt(S.me.coins)}</span></span></div>
  <div class="res" id="gres">${g.i}</div>
  ${g.pick?`<div class="mut">${g.hint}</div><div class="chips" id="gp" style="margin:6px 0">${g.pick.map((p,i)=>`<div class="chip ${i?'':'on'}" data-p="${p}">${g.lab?g.lab[i]:(k==='race'?'🐎'+p:k==='box'?'🎁'+p:p)}</div>`).join('')}</div>`:''}
  <div class="mut" style="margin-top:6px">ውርርድ</div><div class="chips" id="gb" style="margin:6px 0">${[10,50,100,500,1000,5000].map(b=>`<div class="chip ${b===50?'on':''}" data-b="${b}">${b}</div>`).join('')}</div>
  <button class="btn gold" id="gplay" style="width:100%;margin-top:8px">ተጫወት</button>`);
  $$('#gp .chip',m).forEach(c=>c.onclick=()=>{pick=+c.dataset.p;$$('#gp .chip',m).forEach(x=>x.classList.toggle('on',x===c))});
  $$('#gb .chip',m).forEach(c=>c.onclick=()=>{bet=+c.dataset.b;$$('#gb .chip',m).forEach(x=>x.classList.toggle('on',x===c))});
  $('#gplay',m).onclick=async e=>{const b=e.target;b.disabled=true;const out=$('#gres',m);
   const faces=k==='dice'?['⚀','⚁','⚂','⚃','⚄','⚅']:k==='flip'?['🪙','⚪']:k==='race'?['🐎','🏇','🐴']:k==='wheel'?['🎡','✨','💫']:['🎁','📦','🎀'];let n=0;const iv=setInterval(()=>out.textContent=faces[n++%faces.length],90);
   try{const [d]=await Promise.all([api('/api/games/'+k,{bet,pick}),new Promise(r=>setTimeout(r,1100))]);clearInterval(iv);
    S.me.coins=d.coins;setMe(S.me);let t;
    if(k==='dice')t=faces[d.roll-1];else if(k==='flip')t=d.side===1?'ፊት':'ጀርባ';else if(k==='race')t='🏁 #'+d.winner;else t='×'+d.mult;

  try{const d=await api('/api/me');setMe(d.me)}catch(e){}
  const m=S.me,pct=m.next?Math.min(100,Math.round((m.spent-m.base)/(m.next-m.base)*100)):100,link=S.cfg.bot?`https://t.me/${S.cfg.bot}?startapp=ref_${m.tg_id}`:'';
  $('#p-me').innerHTML=topbar()+`<div class="card" style="text-align:center"><div style="display:flex;justify-content:center">${av(m,'l')}</div><h2 style="margin:8px 0 2px">${esc(m.name)}</h2><span class="badge">${m.lvi} ${m.lvn}</span> ${vipTag(m)}<div class="mut" style="margin:6px 0">${esc(m.bio||'—')}</div>
  <div class="bar2"><i style="width:${pct}%"></i></div><div class="mut" style="margin-top:4px">${m.next?`ወደ ቀጣዩ ደረጃ ${fmt(m.next-m.spent)} 🪙 ቀርቷል`:'👑 ከፍተኛ ደረጃ'}</div></div>
  <div class="grid2"><div class="card" style="text-align:center"><div class="mut">የላክሁት ስጦታ</div><b class="gold">${fmt(m.sent)}</b></div><div class="card" style="text-align:center"><div class="mut">የተቀበልኩት</div><b class="gold">${fmt(m.recv)}</b></div></div>
  <div class="col"><button class="btn gold" onclick="openShop()">✨ VIP እና ፍሬም${m.vip?` · ${vipLeft(m)} ቀን`:''}</button><button class="btn" onclick="editProfile()">✏️ ፕሮፋይል አስተካክል</button>${link?`<button class="btn ghost" onclick="navigator.clipboard&&navigator.clipboard.writeText('${link}');toast('📋 የመጋበዣ ሊንክ ተቀድቷል — 10% ቦነስ ታገኛለህ')">🔗 ጓደኛ ጋብዝ (10% ቦነስ)</button>`:''}${m.is_admin?`<button class="btn gold" onclick="openAdmin()">🛡 Admin</button>`:''}</div>`}
function editProfile(){const m=S.me;const o=modal(`<h3>✏️ ፕሮፋይል</h3><div class="col"><input id="e-p" type="file" accept="image/*"><input id="e-n" value="${esc(m.name)}" maxlength="30" placeholder="ስም"><input id="e-b" value="${esc(m.bio)}" maxlength="160" placeholder="ስለ እኔ"><input id="e-t" value="${esc(m.phone)}" maxlength="10" placeholder="ስልክ 09xxxxxxxx"><button class="btn" id="e-go">አስቀምጥ</button></div>`);
  $('#e-go',o).onclick=e=>run(e.target,async()=>{const f=$('#e-p',o).files[0];if(f){const fd=new FormData();fd.append('file',await shrink(f,320,.85),'p.jpg');setMe((await api('/api/profile/photo',fd)).me)}
   setMe((await api('/api/profile',{name:$('#e-n',o).value,bio:$('#e-b',o).value,phone:$('#e-t',o).value})).me);o.close();renderMe()})}

/* ============================== admin ============================== */
function openAdmin(){const o=modal(`<div class="chips" id="at">${['overview','purchases','withdraws','users'].map((t,i)=>`<div class="chip ${i?'':'on'}" data-t="${t}">${t}</div>`).join('')}</div><div id="ab" style="margin-top:10px"></div>`);
  const load=async t=>{$$('#at .chip',o).forEach(c=>c.classList.toggle('on',c.dataset.t===t));const b=$('#ab',o);b.innerHTML='…';
   try{if(t==='overview'){const d=await api('/api/admin/overview');b.innerHTML=`<div class="grid2">${Object.entries(d).map(([k,v])=>`<div class="card" style="margin:0"><div class="mut">${k}</div><b>${fmt(v)}</b></div>`).join('')}</div>`}
   else if(t==='purchases'||t==='withdraws'){const d=await api('/api/admin/'+t);b.innerHTML=d.items.map(x=>`<div class="card"><b>${esc(x.name)}</b> · ${fmt(x.coins)} 🪙 · ${fmt(x.birr)} ብር<div class="mut">${esc(x.ref||x.phone)} · ${ago(x.ts)}</div><div class="row" style="margin-top:8px">${t==='purchases'?`<button class="btn ghost sm" onclick="viewShot(${x.id})">🖼</button><button class="btn sm" onclick="admAct('purchase',${x.id},'approve')">✅</button><button class="btn bad sm" onclick="admAct('purchase',${x.id},'reject')">❌</button>`:`<button class="btn sm" onclick="admAct('withdraw',${x.id},'paid')">💰 Paid</button><button class="btn bad sm" onclick="admAct('withdraw',${x.id},'reject')">❌</button>`}</div></div>`).join('')||'<div class="empty">ባዶ</div>'}
   else{b.innerHTML=`<input id="uq" placeholder="ፈልግ (ስም / telegram id)"><div id="ul" style="margin-top:8px"></div>`;const ld=async()=>{const d=await api('/api/admin/users?q='+encodeURIComponent($('#uq',o).value));$('#ul',o).innerHTML=d.items.map(u=>`<div class="card"><b>${esc(u.name)}</b> ${u.banned?'🚫':''} ${u.vip?'<span class="vip">VIP</span>':''}<div class="mut">tg:${u.tg} · 🪙${fmt(u.coins)} · 💰${fmt(u.earn)}</div><div class="row" style="margin-top:6px;flex-wrap:wrap"><button class="btn sm ghost" onclick="admUser(${u.id},'${u.banned?'unban':'ban'}')">${u.banned?'Unban':'Ban'}</button><button class="btn sm gold" onclick="admGrant(${u.id})">+Coins</button><button class="btn sm ghost" onclick="admVip(${u.id})">+VIP</button><button class="btn sm bad" onclick="confirm('Delete?')&&admUser(${u.id},'delete')">🗑</button></div></div>`).join('')};$('#uq',o).oninput=()=>{clearTimeout(window._uq);window._uq=setTimeout(ld,350)};ld()}}catch(e){b.innerHTML=esc(e.message)}};
  $$('#at .chip',o).forEach(c=>c.onclick=()=>load(c.dataset.t));window._admLoad=load;window._admTab=()=>$('#at .chip.on',o).dataset.t;load('overview')}
const admAct=(k,id,a)=>run(null,async()=>{await api('/api/admin/'+k,{id,action:a});window._admLoad(window._admTab())});
const admUser=(id,a,amount)=>run(null,async()=>{await api('/api/admin/user',{id,action:a,amount});window._admLoad(window._admTab())});
function admVip(id){const n=prompt('VIP ቀናት (1–365)','30');if(n)admUser(id,'vip',+n)}
function admGrant(id){const n=prompt('Coins (አሉታዊም ይቻላል)');if(n)admUser(id,'grant',+n)}
async function viewShot(id){try{const r=await fetch('/api/admin/shot/'+id,{headers:{Authorization:'Bearer '+TOKEN}});const u=URL.createObjectURL(await r.blob());modal(`<img src="${u}" style="width:100%;border-radius:12px">`)}catch(e){toast('አልተገኘም')}}

/* ============================== boot ============================== */
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&R&&R.alive){clearTimeout(R.t);poll()}});
addEventListener('pagehide',()=>{if(R&&TOKEN)try{fetch(`/api/rooms/${R.id}/exit`,{method:'POST',keepalive:true,headers:{Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'},body:'{}'})}catch(e){}});
(async()=>{try{await login();$('#splash').remove();go('home')}catch(e){$('#splash-t').textContent='❌ '+e.message+' — Telegram ውስጥ ክፈት'}})();
</script>
</body>
</html>
