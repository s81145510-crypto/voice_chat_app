<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceChat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            padding: 15px;
            color: #fff;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        .header { text-align: center; padding: 30px 20px; }
        .logo { font-size: 60px; margin-bottom: 10px; }
        .header h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.2);
            padding: 15px 20px;
            border-radius: 16px;
            margin-bottom: 20px;
        }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar {
            width: 45px; height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: bold;
        }
        .user-name { font-weight: 600; font-size: 16px; }
        .user-id { font-size: 11px; color: rgba(255, 255, 255, 0.7); }
        .coin-badge {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            padding: 10px 18px;
            border-radius: 25px;
            font-weight: 700;
            color: #333;
            font-size: 16px;
        }
        .input-group { margin: 15px 0; }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }
        .input-group input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        .input-group input::placeholder { color: rgba(255, 255, 255, 0.5); }
        .btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
        }
        .btn-success {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: #333;
        }
        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 15px;
        }
        .gifts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 15px;
        }
        .gift-card {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .gift-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.6);
        }
        .gift-icon { font-size: 40px; margin-bottom: 8px; display: block; }
        .gift-price { font-weight: 700; font-size: 14px; color: #ffd700; }
        .gift-name { font-size: 11px; color: rgba(255, 255, 255, 0.8); }
        .room-card {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .room-icon {
            width: 50px; height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
        }
        .room-info { flex: 1; }
        .room-name { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
        .room-meta { font-size: 12px; color: rgba(255, 255, 255, 0.7); }
        .hidden { display: none !important; }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 1000;
            transition: transform 0.3s;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { background: rgba(67, 233, 123, 0.9); color: #333; }
        .toast.error { background: rgba(255, 71, 87, 0.9); }
    </style>
</head>
<body>
    <div id="toast" class="toast"></div>
    <div class="container">
        <div id="register-section">
            <div class="card header">
                <div class="logo">🎙️</div>
                <h1>VoiceChat</h1>
                <p>የድምፅ ቻት ማህበረሰብ</p>
            </div>
            <div class="card">
                <div class="section-title">👋 እንኳን ደህና መጣህ</div>
                <div class="input-group">
                    <label>ስምህን አስገባ</label>
                    <input type="text" id="username" placeholder="ለምሳሌ፡ አበበ">
                </div>
                <button class="btn" onclick="register()">🚀 ጀምር</button>
            </div>
        </div>
        <div id="main-section" class="hidden">
            <div class="user-bar">
                <div class="user-info">
                    <div class="avatar" id="user-avatar">👤</div>
                    <div>
                        <div class="user-name" id="user-display">-</div>
                        <div class="user-id" id="user-id-display">-</div>
                    </div>
                </div>
                <div class="coin-badge">🪙 <span id="coin-balance">0</span></div>
            </div>
            <div class="card">
                <div class="section-title">🏠 አዲስ ክፍል ፍጠር</div>
                <div class="input-group">
                    <label>የክፍሉ ስም</label>
                    <input type="text" id="room-name" placeholder="ለምሳሌ፡ ሙዚቃ፣ ዜና...">
                </div>
                <button class="btn btn-success" onclick="createRoom()">✨ ክፍል ፍጠር</button>
            </div>
            <div class="card">
                <div class="section-title">🎁 ስጦታ ላክ</div>
                <div class="input-group">
                    <label>የተቀባይ ID</label>
                    <input type="text" id="recipient-id" placeholder="user_xxxxxxx">
                </div>
                <div class="gifts-grid">
                    <div class="gift-card" onclick="sendGift('coffee')">
                        <span class="gift-icon">☕</span>
                        <div class="gift-price">10 🪙</div>
                        <div class="gift-name">ቡና</div>
                    </div>
                    <div class="gift-card" onclick="sendGift('rose')">
                        <span class="gift-icon">🌹</span>
                        <div class="gift-price">50 🪙</div>
                        <div class="gift-name">ሮዝ</div>
                    </div>
                    <div class="gift-card" onclick="sendGift('car')">
                        <span class="gift-icon">🚗</span>
                        <div class="gift-price">1000 🪙</div>
                        <div class="gift-name">መኪና</div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="section-title">📢 ክፍሎች</div>
                <div id="rooms-list"></div>
            </div>
        </div>
    </div>
    <script>
        let userId = null, username = null;
        function showToast(msg, type='success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show ' + type;
            setTimeout(() => t.className = 'toast', 3000);
        }
        function generateUserId() { return 'user_' + Math.random().toString(36).substr(2, 9); }
        async function register() {
            username = document.getElementById('username').value.trim();
            if (!username) { showToast('⚠️ ስምህን አስገባ!', 'error'); return; }
            userId = generateUserId();
            try {
                const r = await fetch('/api/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user_id: userId, username: username})
                });
                const d = await r.json();
                if (d.success) {
                    document.getElementById('register-section').classList.add('hidden');
                    document.getElementById('main-section').classList.remove('hidden');
                    document.getElementById('user-display').textContent = username;
                    document.getElementById('user-id-display').textContent = userId;
                    document.getElementById('user-avatar').textContent = username.charAt(0).toUpperCase();
                    updateBalance();
                    loadRooms();
                    showToast('🎉 እንኳን ደህና መጣህ ' + username + '!');
                }
            } catch(e) { showToast('❌ ስህተት', 'error'); }
        }
        async function updateBalance() {
            try {
                const r = await fetch('/api/balance?user_id=' + userId);
                const d = await r.json();
                document.getElementById('coin-balance').textContent = d.coins;
            } catch(e) {}
        }
        async function createRoom() {
            const name = document.getElementById('room-name').value.trim();
            if (!name) { showToast('⚠️ የክፍል ስም አስገባ!', 'error'); return; }
            const roomId = 'room_' + Math.random().toString(36).substr(2, 9);
            try {
                const r = await fetch('/api/rooms/create', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({room_id: roomId, room_name: name, user_id: userId})
                });
                const d = await r.json();
                if (d.success) {
                    showToast('✅ ክፍል "' + name + '" ተፈጥሯል!');
                    document.getElementById('room-name').value = '';
                    loadRooms();
                }
            } catch(e) { showToast('❌ ስህተት', 'error'); }
        }
        async function loadRooms() {
            try {
                const r = await fetch('/api/rooms');
                const rooms = await r.json();
                const list = document.getElementById('rooms-list');
                const keys = Object.keys(rooms);
                if (keys.length === 0) {
                    list.innerHTML = '<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.6);"><div style="font-size:60px;">🔇</div><p>ገና ምንም ክፍል የለም</p></div>';
                    return;
                }
                list.innerHTML = '';
                for (const [id, room] of Object.entries(rooms)) {
                    list.innerHTML += '<div class="room-card"><div class="room-icon">🎙️</div><div class="room-info"><div class="room-name">' + room.name + '</div><div class="room-meta">👤 ' + room.creator + '</div></div></div>';
                }
            } catch(e) {}
        }
        async function sendGift(type) {
            const to = document.getElementById('recipient-id').value.trim();
            if (!to) { showToast('⚠️ የተቀባይ ID አስገባ!', 'error'); return; }
            const names = {coffee: '☕ ቡና', rose: '🌹 ሮዝ', car: '🚗 መኪና'};
            try {
                const r = await fetch('/api/gifts/send', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user_id: userId, gift_type: type, recipient_id: to})
                });
                const d = await r.json();
                if (d.success) {
                    showToast('🎁 ' + names[type] + ' ተልኳል!');
                    updateBalance();
                    document.getElementById('recipient-id').value = '';
                } else {
                    showToast('❌ ' + d.error, 'error');
                }
            } catch(e) { showToast('❌ ስህተት', 'error'); }
        }
        setInterval(loadRooms, 5000);
    </script>
</body>
</html>
